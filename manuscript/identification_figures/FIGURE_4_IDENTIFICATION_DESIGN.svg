</defs><rect width="100%" height="100%" fill="#fff"/><text x="650" y="42" text-anchor="middle" class="title">Constituent channels recur, but mechanism allocation remains unidentified</text><rect x="35" y="85" width="390" height="220" rx="14" class="dark"/><text x="230.0" y="115" text-anchor="middle" class="sub">A×D face — Kessler 2008</text><text x="53" y="147" class="body">benzylacetone × nicotine</text><text x="53" y="172" class="body">direct reproductive A×D-like interaction</text><text x="53" y="197" class="body">published Δ ≈ +0.19 to +0.25</text><text x="53" y="222" class="body">missing: selective G/P toggles</text><text x="53" y="247" class="body">systemic-D caveat</text><rect x="455" y="85" width="390" height="220" rx="14" class="dark"/><text x="650.0" y="115" text-anchor="middle" class="sub">G×P face — Egan 2021</text><text x="473" y="147" class="body">herbivory × pollination environment</text><text x="473" y="172" class="body">attraction/defence traits measured</text><text x="473" y="197" class="body">strong consumer-factorial backbone</text><text x="473" y="222" class="body">missing: manipulated floral A×D</text><text x="473" y="247" class="body">defence partly leaf-derived</text><rect x="875" y="85" width="390" height="220" rx="14" class="dark"/><text x="1070.0" y="115" text-anchor="middle" class="sub">A×G×Pₛ — Theis 2012</text><text x="893" y="147" class="body">fragrance × beetle removal</text><text x="893" y="172" class="body">× supplemental hand pollination</text><text x="893" y="197" class="body">three-factor reproductive bridge</text><text x="893" y="222" class="body">missing: distinct D axis</text><text x="893" y="247" class="body">P supplementation ≠ access toggle</text><text x="650" y="345" text-anchor="middle" class="sub">The missing object is their intersection</text><text x="650" y="378" text-anchor="middle" class="tiny">Mechanism Pattern: 56 routes / 25 clusters | A→P 5 | A→G 8 | D→G 18 | D→P 10 | same-system 14 | switches 17</text><text x="6