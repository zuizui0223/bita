</defs><rect width="100%" height="100%" fill="#fff"/><text x="600" y="42" text-anchor="middle" class="title">A total trait interaction does not identify its mechanism</text><rect x="55" y="95" width="420" height="500" rx="14" class="dark"/><text x="265.0" y="125" text-anchor="middle" class="sub">Measured four-cell trait factorial</text><text x="73" y="157" class="body">A and D each have two experimental levels</text><text x="73" y="182" class="body"></text><text x="73" y="207" class="body">ΔAD W = W11 − W10 − W01 + W00</text><text x="73" y="232" class="body"></text><text x="73" y="257" class="body">This is the directly estimable trait interaction</text><text x="73" y="282" class="body">on the chosen biological outcome scale.</text><rect x="95" y="390" width="145" height="65" rx="8" class="soft"/><text x="167" y="428" text-anchor="middle" class="body">W00</text><rect x="275" y="390" width="145" height="65" rx="8" class="soft"/><text x="347" y="428" text-anchor="middle" class="body">W10</text><rect x="95" y="480" width="145" height="65" rx="8" class="soft"/><text x="167" y="518" text-anchor="middle" class="body">W01</text><rect x="275" y="480" width="145" height="65" rx="8" class="soft"/><text x="347" y="518" text-anchor="middle" class="body">W11</text><path d="M490 345 L620 345" class="line"/><polygon points="620,345 606,337 606,353" fill="#222"/><rect x="640" y="85" width="500" height="165" rx="14" class="soft"/><text x="890.0" y="115" text-anchor="middle" class="sub">Possible allocation 1</text><text x="658" y="147" class="body">large antagonist relief</text><text x="658" y="172" class="body">small pollinator interference</text><text x="658" y="197" class="body">non-negative joint cost</text><rect x="640" y="285" width="500" height="165" rx="14" class="soft"/><text x="890.0" y="315" text-anchor="middle" class="sub">Possible allocation 2</text><text x="658" y="347" class="body">moderate antagonist relief</text><text x="658" y="372" class="body">moderate pollinator interference</text><text x="658" y="397" class="body">synergistic hidden joint channel</text><rect x="640" y="485" width="500" height="165" rx="14" class="soft"/><text x="890.0" y="515" text-anchor="middle" class="sub">Possible allocation 3</text><text x="658" y="547" class="body">small relief and small interference</text><text x="658" y="572" class="body">different direct/allocation channel</text><text x="658" y="597" class="body">same observed ΔAD W</text><text x="600" y="710" text-anchor="middle" class="sub">Interaction detection ≠ mechanism allocation</text></svg>