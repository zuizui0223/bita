<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><defs>
<style>
.title{font:700 29px DejaVu Sans,Arial,sans-serif}.sub{font:700 21px DejaVu Sans,Arial,sans-serif}
.body{font:18px DejaVu Sans,Arial,sans-serif}.small{font:15px DejaVu Sans,Arial,sans-serif}.tiny{font:13px DejaVu Sans,Arial,sans-serif}
.box{fill:#fff;stroke:#222;stroke-width:2}.soft{fill:#f4f4f4;stroke:#333;stroke-width:1.8}.dark{fill:#e3e3e3;stroke:#111;stroke-width:2.4}
.line{stroke:#222;stroke-width:2;fill:none}.dash{stroke:#555;stroke-width:2;fill:none;stroke-dasharray:8 7}
</style>
</defs><rect width="100%" height="100%" fill="#fff"/><text x="600" y="42" text-anchor="middle" class="title">An executable path from interaction detection to mechanism identification</text><circle cx="115" cy="130" r="31" class="dark"/><text x="115" y="137" text-anchor="middle" class="sub">1</text><rect x="175" y="90" width="900" height="80" rx="13" class="soft"/><text x="200" y="120" class="sub">Choose A and flower-specific D</text><text x="200" y="149" class="small">Independent biological manipulation of both trait coordinates</text><line x1="115" y1="162" x2="115" y2="195" class="line"/><circle cx="115" cy="235" r="31" class="dark"/><text x="115" y="242" text-anchor="middle" class="sub">2</text><rect x="175" y="195" width="900" height="80" rx="13" class="soft"/><text x="200" y="225" class="sub">Engineer selective G and P interventions</text><text x="200" y="254" class="small">Use body size, route, diel period, phenology or other access asymmetry</text><line x1="115" y1="267" x2="115" y2="300" class="line"/><circle cx="115" cy="340" r="31" class="dark"/><text x="115" y="347" text-anchor="middle" class="sub">3</text><rect x="175" y="300" width="900" height="80" rx="13" class="soft"/><text x="200" y="330" class="sub">Run A×D×G×P</text><text x="200" y="359" class="small">Estimate ΔAD W and the consumer contrasts</text><line x1="115" y1="372" x2="115" y2="405" class="line"/><circle cx="115" cy="445" r="31" class="dark"/><text x="115" y="452" text-anchor="middle" class="sub">4</text><rect x="175" y="405" width="900" height="80" rx="13" class="soft"/><text x="200" y="435" class="sub">Measure m0,Δ</text><text x="200" y="464" class="small">Do not assume pollinator-independent reproduction has zero A×D interaction</text><line x1="115" y1="477" x2="115" y2="510" class="line"/><circle cx="115" cy="550" r="31" class="dark"/><text x="115" y="557" text-anchor="middle" class="sub">5</text><rect x="175" y="510" width="900" height="80" rx="13" class="soft"/><text x="200" y="540" class="sub">Test four-way separability</text><text x="200" y="569" class="small">Non-zero A×D×G×P coupling is a biological result</text><line x1="115" y1="582" x2="115" y2="615" class="line"/><circle cx="115" cy="655" r="31" class="dark"/><text x="115" y="662" text-anchor="middle" class="sub">6</text><rect x="175" y="615" width="900" height="80" rx="13" class="soft"/><text x="200" y="645" class="sub">Run independent A×D cost assay</text><text x="200" y="674" class="small">Keep UΔ unallocated until the assay constrains its interpretation</text><line x1="115" y1="687" x2="115" y2="720" class="line"/><circle cx="115" cy="760" r="31" class="dark"/><text x="115" y="767" text-anchor="middle" class="sub">7</text><rect x="175" y="720" width="900" height="80" rx="13" class="soft"/><text x="200" y="750" class="sub">Classify the outcome</text><text x="200" y="779" class="small">channel-resolved / non-separable / assay-discordant / hidden-channel sign constrained</text></svg>