<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780"><defs>
<style>
.title{font:700 29px DejaVu Sans,Arial,sans-serif}.sub{font:700 21px DejaVu Sans,Arial,sans-serif}
.body{font:18px DejaVu Sans,Arial,sans-serif}.small{font:15px DejaVu Sans,Arial,sans-serif}.tiny{font:13px DejaVu Sans,Arial,sans-serif}
.box{fill:#fff;stroke:#222;stroke-width:2}.soft{fill:#f4f4f4;stroke:#333;stroke-width:1.8}.dark{fill:#e3e3e3;stroke:#111;stroke-width:2.4}
.line{stroke:#222;stroke-width:2;fill:none}.dash{stroke:#555;stroke-width:2;fill:none;stroke-dasharray:8 7}
</style>
</defs><rect width="100%" height="100%" fill="#fff"/><text x="600" y="42" text-anchor="middle" class="title">Do not define the joint cost as a residual</text><rect x="55" y="100" width="500" height="245" rx="14" class="soft"/><text x="305.0" y="130" text-anchor="middle" class="sub">Crossed consumer design</text><text x="73" y="162" class="body">Estimate ΔAD W, ρΔ and ιΔ</text><text x="73" y="187" class="body">after m0,Δ correction and separability test</text><text x="73" y="212" class="body"></text><text x="73" y="237" class="body">UΔ = ρΔ − ιΔ − ΔAD W</text><text x="73" y="262" class="body">UΔ remains an unallocated joint channel</text><rect x="645" y="100" width="500" height="245" rx="14" class="soft"/><text x="895.0" y="130" text-anchor="middle" class="sub">Independent A×D cost assay</text><text x="663" y="162" class="body">Standardize/suppress biotic channels</text><text x="663" y="187" class="body">Measure construction or allocation endpoint</text><text x="663" y="212" class="body"></text><text x="663" y="237" class="body">κassay,Δ = ΔAD Cassay</text><text x="663" y="262" class="body">Do not derive this from UΔ</text><path d="M305 365 L305 435 L600 435" class="line"/><path d="M895 365 L895 435 L600 435" class="line"/><polygon points="600,435 586,427 586,443" fill="#222"/><rect x="285" y="455" width="630" height="145" rx="14" class="dark"/><text x="600.0" y="485" text-anchor="middle" class="sub">Compare residual with independent assay</text><text x="303" y="517" class="body">agreement → supports channel allocation</text><text x="303" y="542" class="body">disagreement → missing channel / intervention failure / scale mismatch</text><rect x="80" y="645" width="1040" height="90" rx="14" class="box"/><text x="600" y="678" text-anchor="middle" class="sub">Sign diagnostic</text><text x="600" y="713" text-anchor="middle" class="body">If ΔAD W &gt; 0 and ρΔ ≤ ιΔ, the remaining joint channel must be negative.</text></svg>