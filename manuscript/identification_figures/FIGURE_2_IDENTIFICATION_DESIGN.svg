ect x="60" y="405" width="520" height="235" rx="14" class="soft"/><text x="320.0" y="435" text-anchor="middle" class="sub">G excluded / P present</text><text x="78" y="467" class="body">Within this consumer state:</text><text x="78" y="492" class="body">measure the same four A×D cells</text><text x="78" y="517" class="body">W00   W10   W01   W11</text><rect x="105" y="550" width="165" height="42" rx="6" class="box"/><text x="187" y="577" text-anchor="middle" class="small">A=0, D=0</text><rect x="315" y="550" width="165" height="42" rx="6" class="box"/><text x="397" y="577" text-anchor="middle" class="small">A=1, D=0</text><rect x="105" y="605" width="165" height="42" rx="6" class="box"/><text x="187" y="632" text-anchor="middle" class="small">A=0, D=1</text><rect x="315" y="605" width="165" height="42" rx="6" class="box"/><text x="397" y="632" text-anchor="middle" class="small">A=1, D=1</text><rect x="660" y="405" width="520" height="235" rx="14" class="soft"/><text x="920.0" y="435" text-anchor="middle" class="sub">G present / P present</text><text x="678" y="467" class="body">Within this consumer state:</text><text x="678" y="492" class="body">measure the same four A×D cells</text><text x="678" y="517" class="body">W00   W10   W01   W11</text><rect x="705" y="550" width="165" height="42" rx="6" class="box"/><text x="787" y="577" text-anchor="middle" class="small">A=0, D=0</text><rect x="915" y="550" width="165" height="42" rx="6" class="box"/><text x="997" y="577" text-anchor="middle" class="small">A=1, D=0</text><rect x="705" y="605" width="165" height="42" rx="6" class="box"/><text x="787" y="632" text-anchor="middle" class="small">A=0, D=1</text><rect x="915" y="605" width="165" height="42" rx="6" class="box"/><text x="997" y="632" text-anchor="middle" class="small">A=1, D=1</text><text x="650" y="690" text-anchor="middle" class="sub">Channel contrasts</text><text x="80" y="730" class="body">ρΔ = −ΔAD[W(G excluded) − W(G present)]</text><text x="80" y="766" class="body">ιΔinc = −ΔAD[W(P present) − W(P excluded)]</text><text x="80" y="802" class="body">ιΔ = ιΔinc − m0,Δ</text><rect x="690" y="690" width="540" height="125" rx="14" class="dark"/><text x="960" y="724" text-anchor="middle" class="sub">Internal separability diagnostic</text><text x="715" y="760" class="body">A×D×G×P four-way coupling = 0?</text><text x="715" y="792" class="small">ρ cross-P gap and ι cross-G gap are the same contrast up to sign.</text></svg>