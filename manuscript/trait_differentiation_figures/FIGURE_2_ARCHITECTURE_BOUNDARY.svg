<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<defs>
<style>
.title{font:700 29px DejaVu Sans,Arial,sans-serif}.sub{font:700 21px DejaVu Sans,Arial,sans-serif}.body{font:18px DejaVu Sans,Arial,sans-serif}.small{font:15px DejaVu Sans,Arial,sans-serif}.tiny{font:13px DejaVu Sans,Arial,sans-serif}
.line{stroke:#222;stroke-width:2.3;fill:none}.thin{stroke:#666;stroke-width:1.8;fill:none}.dash{stroke:#555;stroke-width:2;fill:none;stroke-dasharray:8 6}.grid{stroke:#d0d0d0;stroke-width:1;fill:none}
.soft{fill:#f4f4f4;stroke:#333;stroke-width:1.8}.light{fill:#fafafa;stroke:#aaa;stroke-width:1.2}
</style>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="600" y="42" text-anchor="middle" class="title">The differentiation boundary depends on conflict load, decoupling and architecture cost</text>

<!-- Plot frame -->
<rect x="120" y="105" width="720" height="520" class="light"/>
<line x1="120" y1="625" x2="865" y2="625" class="line"/>
<polygon points="865,625 851,617 851,633" fill="#222"/>
<line x1="120" y1="625" x2="120" y2="80" class="line"/>
<polygon points="120,80 112,94 128,94" fill="#222"/>

<!-- grid -->
<line x1="300" y1="105" x2="300" y2="625" class="grid"/>
<line x1="480" y1="105" x2="480" y2="625" class="grid"/>
<line x1="660" y1="105" x2="660" y2="625" class="grid"/>
<line x1="120" y1="495" x2="840" y2="495" class="grid"/>
<line x1="120" y1="365" x2="840" y2="365" class="grid"/>
<line x1="120" y1="235" x2="840" y2="235" class="grid"/>

<text x="480" y="685" text-anchor="middle" class="sub">shared-axis conflict load  L<tspan baseline-shift="sub" font-size="14">S</tspan>*</text>
<text x="40" y="365" transform="rotate(-90 40 365)" text-anchor="middle" class="sub">extra architecture cost  K</text>

<!-- boundaries y=sx converted to SVG coords -->
<!-- s=1 -->
<line x1="120" y1="625" x2="750" y2="105" class="line"/>
<text x="690" y="122" class="body">s = 1.0</text>
<!-- s=.6 -->
<line x1="120" y1="625" x2="840" y2="313" class="dash"/>
<text x="748" y="300" class="body">s = 0.6</text>
<!-- s=.3 -->
<line x1="120" y1="625" x2="840" y2="469" class="thin"/>
<text x="748" y="455" class="body">s = 0.3</text>

<!-- annotations -->
<text x="405" y="555" text-anchor="middle" class="sub">differentiation</text>
<text x="405" y="582" text-anchor="middle" class="small">K &lt; s L<tspan baseline-shift="sub" font-size="12">S</tspan>*</text>
<text x="550" y="185" text-anchor="middle" class="sub">shared compromise</text>
<text x="550" y="212" text-anchor="middle" class="small">K &gt; s L<tspan baseline-shift="sub" font-size="12">S</tspan>*</text>

<!-- right explanation -->
<rect x="895" y="120" width="260" height="455" rx="14" class="soft"/>
<text x="1025" y="155" text-anchor="middle" class="sub">What moves the boundary?</text>
<text x="920" y="205" class="body">1. Conflict load</text>
<text x="920" y="232" class="small">larger |θ₁ − θ₂|</text>
<text x="920" y="254" class="small">moves rightward</text>

<text x="920" y="310" class="body">2. Decoupling s</text>
<text x="920" y="337" class="small">stronger residual coupling λ</text>
<text x="920" y="359" class="small">reduces s and lowers the line</text>

<text x="920" y="415" class="body">3. Architecture cost K</text>
<text x="920" y="442" class="small">higher development / regulation /</text>
<text x="920" y="464" class="small">coordination cost moves upward</text>

<text x="1025" y="525" text-anchor="middle" class="body">same trade-off ≠ same outcome</text>
<text x="1025" y="550" text-anchor="middle" class="small">because the attainable decoupling</text>
<text x="1025" y="570" text-anchor="middle" class="small">and its cost can differ among systems</text>

<text x="600" y="725" text-anchor="middle" class="sub">Residual coupling changes how much of the shared-trait compromise is actually worth recovering</text>
</svg>
