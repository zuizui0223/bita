<text x="342.8" y="198.0" text-anchor="end" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="700">LRR -0.483</text>
<text x="825.0" y="215.0" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400">I² 99.3%</text>
<text x="235.0" y="308.0" text-anchor="end" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400">legitimate visitation</text>
