<text x="508.2" y="288.0" text-anchor="end" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="700">LRR -0.291</text>
<text x="825.0" y="305.0" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400">I² 97.5%</text>
<text x="70.0" y="420.0" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400">Direction retained in 100% of declared leave-one-cluster-out refits; within-cluster-correlation and quarantined-row sensitivities preserve the three informative conclusions.</text>
<text x="70.0" y="448.0" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400">High heterogeneity is retained as part of the Pattern result; the bars are pooled LRRs, not W_AD or model parameters.</text>
<text x="900.0" y="55.0" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700">B  FVOC reproduced synthesis</text>
<line x1="1150.6" y1="190" x2="1383.6" y2="190" stroke="#222" stroke-width="8"/>
<circle cx="1229.0" cy="190" r="9" fill="#fff" stroke="#111" stroke-width="3"/>
<circle cx="1232.1" cy="168" r="7" fill="#111"/>
<text x="1232.1" y="148.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" font-weight="700">full +0.129</text>
<text x="1150.6" y="232.0" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" font-weight="400">min +0.0873</text>
<text x="1229.0" y="232.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" font-weight="400">median +0.1274</text>
<text x="1383.6" y="232.0" text-anchor="end" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" font-weight="400">max +0.2065</text>
<text x="920.0" y="300.0" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="700">32/32 leave-one-study-component-out contrasts remain positive</text>
<text x="920.0" y="333.0" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400">Only three study components contain both physiological roles; all three paired differences are zero</text>
<text x="920.0" y="365.0" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400">The assembled +0.129 pattern is therefore not a causal within-study pollinator-versus-florivore effect</text>
<text x="800.0" y="680.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400">Robustness metrics remain module-specific: continuous LRR influence/heterogeneity for Leal; categorical study-component influence and composition limits for Sasidharan.</text>
