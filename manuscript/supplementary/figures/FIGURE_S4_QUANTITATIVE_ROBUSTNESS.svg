<text x="578.0" y="108.0" text-anchor="end" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="700">LRR -0.210</text>
<text x="825.0" y="125.0" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="400">I² 99.5%</text>
<text x="235.0" y="218.0" text-anchor="end" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400">nectar standing crop</text>
