<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Mechanistic architecture, orientation gate, and inference boundary of the local attraction-defence interaction</title>
  <desc id="desc">A conceptual diagram linking one attraction trait and one flower-specific defence trait to mutualist, antagonist, and direct-cost channels. The always-valid signed identity passes through an explicit orientation gate before the non-negative relief-interference-cost balance is used. A lower inference boundary states that total fitness curvature alone does not identify the component mechanisms.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d2d2d"/>
    </marker>
    <style>
      .box { fill:#ffffff; stroke:#303030; stroke-width:2.3; rx:16; ry:16; }
      .soft { fill:#f3f3f3; }
      .gate { fill:#e8e8e8; stroke:#111111; stroke-width:3; rx:16; ry:16; }
      .title { font:700 30px Arial, Helvetica, sans-serif; fill:#111; }
      .head { font:700 21px Arial, Helvetica, sans-serif; fill:#111; }
      .body { font:400 17px Arial, Helvetica, sans-serif; fill:#222; }
      .small { font:400 14px Arial, Helvetica, sans-serif; fill:#333; }
      .eq { font:700 23px Arial, Helvetica, sans-serif; fill:#111; }
      .arrow { stroke:#333; stroke-width:2.4; fill:none; marker-end:url(#arrow); }
      .dash { stroke-dasharray:8 7; }
      .boundary { stroke:#111; stroke-width:3; stroke-dasharray:12 10; }
    </style>
  </defs>

  <rect width="1500" height="900" fill="#ffffff"/>
  <text x="750" y="42" text-anchor="middle" class="title">Figure 1. From floral traits to an oriented local interaction</text>

  <!-- focal traits -->
  <rect x="45" y="105" width="235" height="120" class="box soft"/>
  <text x="163" y="145" text-anchor="middle" class="head">Attraction trait A</text>
  <text x="163" y="177" text-anchor="middle" class="body">one declared signal,</text>
  <text x="163" y="201" text-anchor="middle" class="body">reward, display, or interface</text>

  <rect x="45" y="430" width="235" height="135" class="box soft"/>
  <text x="163" y="470" text-anchor="middle" class="head">Defence trait D</text>
  <text x="163" y="502" text-anchor="middle" class="body">flower-specific trait with</text>
  <text x="163" y="526" text-anchor="middle" class="body">declared antagonist-reduction</text>
  <text x="163" y="550" text-anchor="middle" class="body">role</text>

  <!-- ecological channels -->
  <rect x="355" y="85" width="270" height="125" class="box"/>
  <text x="490" y="126" text-anchor="middle" class="head">Mutualist channel M</text>
  <text x="490" y="158" text-anchor="middle" class="body">pollinator service, pollen</text>
  <text x="490" y="182" text-anchor="middle" class="body">transfer, or declared benefit</text>

  <rect x="355" y="285" width="270" height="125" class="box"/>
  <text x="490" y="326" text-anchor="middle" class="head">Antagonist channel G</text>
  <text x="490" y="358" text-anchor="middle" class="body">florivory, robbery, disease,</text>
  <text x="490" y="382" text-anchor="middle" class="body">or another declared loss</text>

  <rect x="355" y="485" width="270" height="125" class="box"/>
  <text x="490" y="526" text-anchor="middle" class="head">Direct cost channel C</text>
  <text x="490" y="558" text-anchor="middle" class="body">construction, allocation, or</text>
  <text x="490" y="582" text-anchor="middle" class="body">physiological interaction cost</text>

  <!-- trait-to-channel arrows -->
  <path d="M280 150 C310 140 330 140 355 145" class="arrow"/>
  <text x="318" y="124" text-anchor="middle" class="small">mutualist return</text>
  <path d="M280 185 C315 225 330 285 355 320" class="arrow"/>
  <text x="314" y="255" text-anchor="middle" class="small">antagonist exposure</text>
  <path d="M280 472 C320 445 330 400 355 375" class="arrow"/>
  <text x="314" y="430" text-anchor="middle" class="small">antagonist reduction</text>
  <path d="M280 450 C315 350 330 220 355 170" class="arrow dash"/>
  <text x="310" y="330" text-anchor="middle" class="small">possible pollinator interference</text>
  <path d="M280 535 C310 540 330 545 355 548" class="arrow"/>
  <path d="M280 215 C320 325 330 485 355 525" class="arrow"/>
  <text x="314" y="596" text-anchor="middle" class="small">A × D direct cost</text>

  <!-- always-valid identity -->
  <rect x="690" y="185" width="300" height="205" class="box soft"/>
  <text x="840" y="226" text-anchor="middle" class="head">Signed identity</text>
  <text x="840" y="275" text-anchor="middle" class="eq">W_AD = M_AD − G_AD − C_AD</text>
  <text x="840" y="320" text-anchor="middle" class="body">always algebraically valid</text>
  <text x="840" y="348" text-anchor="middle" class="small">biological labels alone do not fix</text>
  <text x="840" y="370" text-anchor="middle" class="small">the three component signs</text>

  <path d="M625 145 C655 155 670 200 690 250" class="arrow"/>
  <path d="M625 348 C655 338 670 318 690 305" class="arrow"/>
  <path d="M625 548 C655 515 670 405 690 355" class="arrow"/>

  <!-- explicit orientation gate -->
  <rect x="1040" y="145" width="405" height="280" class="gate"/>
  <text x="1243" y="186" text-anchor="middle" class="head">ORIENTATION GATE</text>
  <text x="1243" y="229" text-anchor="middle" class="eq">M_AD ≤ 0   ·   G_AD ≤ 0   ·   C_AD ≥ 0</text>
  <text x="1080" y="275" class="body">define non-negative magnitudes:</text>
  <text x="1110" y="312" class="body">ι = −M_AD</text>
  <text x="1250" y="312" class="body">ρ = −G_AD</text>
  <text x="1370" y="312" class="body">κ = C_AD</text>
  <text x="1243" y="357" text-anchor="middle" class="small">Gate must be justified for the focal traits,</text>
  <text x="1243" y="380" text-anchor="middle" class="small">outcome scale, and ecological neighbourhood</text>

  <path d="M990 285 C1010 285 1020 285 1040 285" class="arrow"/>

  <!-- oriented balance -->
  <rect x="1015" y="475" width="455" height="165" class="box soft"/>
  <text x="1243" y="516" text-anchor="middle" class="head">Oriented local balance</text>
  <text x="1243" y="558" text-anchor="middle" class="eq">W_AD = ρ − ι − κ</text>
  <text x="1243" y="594" text-anchor="middle" class="body">complementary iff  ρ &gt; ι + κ</text>
  <text x="1243" y="620" text-anchor="middle" class="small">substitutable when the reverse inequality holds</text>
  <path d="M1243 425 L1243 475" class="arrow"/>

  <!-- inference boundary -->
  <line x1="55" y1="700" x2="1445" y2="700" class="boundary"/>
  <rect x="410" y="675" width="680" height="52" fill="#ffffff"/>
  <text x="750" y="706" text-anchor="middle" class="head">INFERENCE BOUNDARY</text>
  <text x="750" y="755" text-anchor="middle" class="body">Even exact total W or W_AD does not uniquely identify M_AD, G_AD, and C_AD.</text>
  <text x="750" y="786" text-anchor="middle" class="body">Channel-specific measurements, interventions, or justified structural restrictions are required.</text>
  <text x="750" y="835" text-anchor="middle" class="small">Positive W_AD is local complementarity on the declared coordinates/outcome scale; it does not imply positive first derivatives, trait covariance, or an evolutionary endpoint.</text>
</svg>
