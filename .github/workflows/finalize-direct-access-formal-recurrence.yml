name: Finalize direct-access formal recurrence

on:
  push:
    branches:
      - analysis/formal-biblio-openalex-fetch-v1
    paths:
      - .github/workflows/finalize-direct-access-formal-recurrence.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run final gate regression tests
        run: |
          python -m pip install -q pytest
          pytest -q \
            tests/test_direct_access_geometry_fulltext_decisions.py \
            tests/test_direct_access_geometry_formal_recurrence_summary.py

      - name: Validate complete V23 ledger
        run: |
          python scripts/validate_direct_access_geometry_fulltext_decisions.py \
            --screen empirical/floral_defence_selectivity/formal_bibliographic_frame_v2/DIRECT_ACCESS_GEOMETRY_BIBLIOGRAPHIC_SCREEN_V1.csv \
            --decisions empirical/floral_defence_selectivity/formal_bibliographic_frame_v2/DIRECT_ACCESS_GEOMETRY_ELIGIBILITY_DECISIONS_V23.csv \
            --require-complete \
            --output empirical/floral_defence_selectivity/formal_bibliographic_frame_v2/DIRECT_ACCESS_GEOMETRY_FULLTEXT_COMPLETE_RECEIPT_V1.json

      - name: Open formal finite-frame recurrence summary
        run: |
          python scripts/summarize_direct_access_geometry_formal_recurrence.py \
            --screen empirical/floral_defence_selectivity/formal_bibliographic_frame_v2/DIRECT_ACCESS_GEOMETRY_BIBLIOGRAPHIC_SCREEN_V1.csv \
            --decisions empirical/floral_defence_selectivity/formal_bibliographic_frame_v2/DIRECT_ACCESS_GEOMETRY_ELIGIBILITY_DECISIONS_V23.csv \
            --bootstrap-receipt empirical/floral_defence_selectivity/formal_bibliographic_frame_v2/DIRECT_ACCESS_GEOMETRY_BIBLIOGRAPHIC_SCREEN_BOOTSTRAP_RECEIPT_V1.json \
            --output empirical/floral_defence_selectivity/formal_bibliographic_frame_v2/DIRECT_ACCESS_GEOMETRY_FORMAL_RECURRENCE_SUMMARY_V1.json

      - name: Verify formal summary invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("empirical/floral_defence_selectivity/formal_bibliographic_frame_v2/DIRECT_ACCESS_GEOMETRY_FORMAL_RECURRENCE_SUMMARY_V1.json")
          r=json.loads(p.read_text())
          assert r["status"]=="FORMAL_FINITE_FRAME_DIRECTION_SUMMARY_OPEN"
          assert r["frame_records"]==857
          assert r["eligible_direct_programs"]==33
          assert r["direction_counts"]=={"POSITIVE":22,"NULL":5,"OPPOSITE":4,"MIXED":2}
          assert r["preexisting_direct_programs_recovered"]==23
          assert r["preexisting_provider_absent_programs"]==1
          assert r["preexisting_provider_absent_program_ids"]==["Urcelay_Morales_Chalcoff_2006"]
          assert r["known_corpus_programs_accounted"]==24
          assert r["new_eligible_programs_from_formal_frame"]==10
          assert r["new_eligible_direction_counts"]=={"POSITIVE":7,"NULL":0,"OPPOSITE":3,"MIXED":0}
          assert r["formal_direction_p_value_computed"] is False
          assert r["pooled_effect_computed"] is False
          assert r["natural_prevalence_estimated"] is False
          print(json.dumps(r,indent=2,sort_keys=True))
          PY

      - name: Commit formal summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            empirical/floral_defence_selectivity/formal_bibliographic_frame_v2/DIRECT_ACCESS_GEOMETRY_FULLTEXT_COMPLETE_RECEIPT_V1.json \
            empirical/floral_defence_selectivity/formal_bibliographic_frame_v2/DIRECT_ACCESS_GEOMETRY_FORMAL_RECURRENCE_SUMMARY_V1.json
          if git diff --cached --quiet; then
            echo "No final summary changes."
          else
            git commit -m "Open formal direct-access recurrence summary"
            git pull --rebase origin analysis/formal-biblio-openalex-fetch-v1
            git push origin HEAD:analysis/formal-biblio-openalex-fetch-v1
          fi
