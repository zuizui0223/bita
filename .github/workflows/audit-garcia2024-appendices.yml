name: Audit Garcia 2024 JPE appendices

on:
  pull_request:
    paths:
      - "scripts/audit_garcia2024_appendices.py"
      - ".github/workflows/audit-garcia2024-appendices.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded spreadsheet parser
        run: python -m pip install "openpyxl>=3.1,<4"
      - name: Audit public JPE appendices
        run: |
          python scripts/audit_garcia2024_appendices.py artifacts/garcia2024_appendix_audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: garcia2024-appendix-audit
          path: artifacts/garcia2024_appendix_audit.json
          if-no-files-found: error
