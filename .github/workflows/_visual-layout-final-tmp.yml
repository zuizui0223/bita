name: One-time final visual label spacing

on:
  push:
    branches:
      - agent/manuscript-reader-qa-v1

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/_visual_layout_final_tmp.py
      - name: Commit source and remove temporary machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finish supplementary label spacing after visual QA'
          git push origin HEAD:${GITHUB_REF_NAME}
