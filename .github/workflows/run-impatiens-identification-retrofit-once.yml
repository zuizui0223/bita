name: run-impatiens-identification-retrofit-once

on:
  pull_request:
    paths:
      - 'scripts/reanalyze_impatiens_identification_retrofit.py'
      - 'trait_architecture/ols_hc3.py'
      - 'tests/test_impatiens_identification_retrofit.py'
      - '.github/workflows/run-impatiens-identification-retrofit-once.yml'

permissions:
  contents: write

jobs:
  retrofit:
    if: github.head_ref == 'theory/identification-design-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out identification branch
        uses: actions/checkout@v4
        with:
          ref: theory/identification-design-v1
      - name: Check out historical source-recovery code
        uses: actions/checkout@v4
        with:
          ref: impatiens-empirical-core
          path: historical
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install current project
        run: python -m pip install -e '.[dev]'
      - name: Recover title-validated Dryad processed panel into runner temp only
        env:
          TEMP_CSV: ${{ runner.temp }}/Impatiens_Processed_Data.csv
        run: |
          python - <<'PY'
          import io
          import os
          import sys
          import zipfile
          from pathlib import Path

          historical = Path('historical').resolve()
          sys.path.insert(0, str(historical))
          from trait_architecture.dryad_archive_schema import _download_archive, _version_url
          from trait_architecture.title_validated_dryad_manifest import probe_targets, read_targets

          targets = historical / 'empirical/four_path_effects/title_validated_dataset_targets.csv'
          receipts, _ = probe_targets(read_targets(targets))
          receipt = next(
              item for item in receipts
              if item.manifest_status == 'manifest_recovered' and _version_url(item)
          )
          archive_url = f"{_version_url(receipt)}/download"
          archive_bytes = _download_archive(archive_url, landing_page_url=receipt.landing_page_url)
          archive = zipfile.ZipFile(io.BytesIO(archive_bytes))
          member = next(item for item in archive.infolist() if item.filename.endswith('Processed_Data.csv'))
          destination = Path(os.environ['TEMP_CSV'])
          destination.write_bytes(archive.read(member))
          print(f"Recovered validated processed panel to runner temp: {member.filename}; bytes={destination.stat().st_size}")
          PY
      - name: Run registered identification retrofit
        env:
          TEMP_CSV: ${{ runner.temp }}/Impatiens_Processed_Data.csv
        run: |
          python scripts/reanalyze_impatiens_identification_retrofit.py \
            "$TEMP_CSV" \
            empirical/identification_design/IMPATIENS_2018_IDENTIFICATION_RETROFIT_V1.json \
            empirical/identification_design/IMPATIENS_2018_IDENTIFICATION_RETROFIT_V1.md
      - name: Validate retrofit boundaries
        run: |
          pytest -q tests/test_impatiens_identification_retrofit.py
          grep -q 'not.*rho/iota/kappa reconstruction' empirical/identification_design/IMPATIENS_2018_IDENTIFICATION_RETROFIT_V1.md
          grep -q 'simulated increases' empirical/identification_design/IMPATIENS_2018_IDENTIFICATION_RETROFIT_V1.json
          test -s empirical/identification_design/IMPATIENS_2018_IDENTIFICATION_RETROFIT_V1.json
      - name: Commit aggregate retrofit outputs only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            empirical/identification_design/IMPATIENS_2018_IDENTIFICATION_RETROFIT_V1.json \
            empirical/identification_design/IMPATIENS_2018_IDENTIFICATION_RETROFIT_V1.md
          if git diff --cached --quiet; then
            echo 'No aggregate result change.'
          else
            git commit -m 'Add Impatiens identification retrofit results'
            git push origin HEAD:theory/identification-design-v1
          fi
