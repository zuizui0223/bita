name: patch-open-research-statement-once

on:
  pull_request:
    paths:
      - 'scripts/patch_open_research_statement_once.py'
      - '.github/workflows/patch-open-research-statement-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'submission/final-metadata-audit-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: submission/final-metadata-audit-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synchronize canonical Open Research statement
        run: python scripts/patch_open_research_statement_once.py
      - name: Validate statement boundary
        run: |
          grep -q 'public project repository for peer review' manuscript/MANUSCRIPT_THEORETICAL_ECOLOGY.md
          grep -q 'acceptance stage' manuscript/MANUSCRIPT_THEORETICAL_ECOLOGY.md
          ! grep -q 'archival DOI for the submitted version.*inserted before submission' manuscript/MANUSCRIPT_THEORETICAL_ECOLOGY.md
      - name: Commit synchronized manuscript metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manuscript/MANUSCRIPT_THEORETICAL_ECOLOGY.md
          if git diff --cached --quiet; then
            echo 'No metadata change needed.'
          else
            git commit -m 'Synchronize manuscript Open Research statement'
            git push origin HEAD:submission/final-metadata-audit-v1
          fi
