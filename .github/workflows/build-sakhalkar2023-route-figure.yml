name: Build two-network access-routing figure

on:
  pull_request:
    paths:
      - "scripts/analyze_sakhalkar2023_network.py"
      - "scripts/build_sakhalkar2023_route_figure_svg.py"
      - "tests/test_sakhalkar2023_route_figure.py"
      - "empirical/floral_defence_selectivity/results/aubert2026_zenodo_extension.json"
      - "empirical/floral_defence_selectivity/results/aubert2026_missingness_dependence_sensitivity.json"
      - "empirical/floral_defence_selectivity/results/aubert2026_participation_route_decomposition_first_open.json"
      - ".github/workflows/build-sakhalkar2023-route-figure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and tests
        run: python -m pip install -e '.[dev]'
      - name: Test route-figure contracts
        run: pytest -q tests/test_sakhalkar2023_route_figure.py tests/test_sakhalkar2023_network_analysis.py
      - name: Build Figure 4 from public data
        run: |
          python scripts/build_sakhalkar2023_route_figure_svg.py --output artifacts/FIGURE_4_TWO_NETWORK_ACCESS_ROUTING.svg
      - name: Verify aggregate annotations
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("artifacts/FIGURE_4_TWO_NETWORK_ACCESS_ROUTING.svg")
          text = path.read_text(encoding="utf-8")
          expected = [
              "n = 57 species",
              "rho = 0.347",
              "permutation p = 0.0086",
              "Aubert / EPHI",
              "259 plant species",
              "plant-level mismatch rho = 0.503",
              "plant paired barrier: 130 species",
              "bird paired barrier: 36 species",
              "within-bird continuous: 28 species / 1,285 dyads",
              "centered-rank rho = 0.340",
              "barrier 0.147 vs accessible 0.020",
              "18 / 18 sites",
              "total exploitation RR = 1.772",
              "95% CI 1.105–2.841",
          ]
          missing = [item for item in expected if item not in text]
          if missing:
              stat_lines = [
                  line.strip()
                  for line in text.splitlines()
                  if "species" in line or "rho" in line or "permutation" in line
              ]
              raise SystemExit(f"missing annotations: {missing}; observed stat lines: {stat_lines}")
          print("Figure 4 aggregate annotations verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: two-network-access-routing-figure
          path: artifacts/FIGURE_4_TWO_NETWORK_ACCESS_ROUTING.svg
          if-no-files-found: error
