name: bita-forward-dol-original-stat-audit
on:
  push:
    branches: ['analysis/bita-forward-dol-source-20261116']
    paths:
      - '.github/workflows/bita-forward-dol-original-stat-audit.yml'
      - 'scripts/analyze_bita_forward_dol.py'
      - 'tests/test_bita_forward_dol.py'
      - 'empirical/trait_architecture_history/kim_zhang_forward_dol_readout.json'
  pull_request:
    branches: ['analysis/bita-autonomy-reversal-20261115']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-two-forward-programmes:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reobtain source XML and verify both original scientific SHA256 fingerprints
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,hashlib
          articles=[
              ('PMC4748119','a876e838044cb44ab28c47a1f9e243df3172c15650ad52f56be1e1a1d5c8ab68','kim_original.xml'),
              ('PMC6962034','bfe5787f48f0c2dde277d9d6db6387180472b55c182c5d45738309e45cc0d092','zhang_original.xml')]
          for pmcid,expected,target in articles:
              url='https://www.ebi.ac.uk/europepmc/webservices/rest/'+pmcid+'/fullTextXML'
              req=urllib.request.Request(url,headers={'User-Agent':'BITA-empirical-dol-source-audit/1.0',
                                                      'Accept':'application/xml'})
              with urllib.request.urlopen(req,timeout=35) as resp:
                  raw=resp.read(2300000)
              if hashlib.sha256(raw).hexdigest()!=expected:
                  raise ValueError('original article content changed '+pmcid)
              open(target,'wb').write(raw)
              print('BITA_ORIGINAL_JATS_SHA:'+pmcid+':'+expected)
          PY
      - name: Compute traceable effects and biological unit constraints
        run: |
          python -m scripts.analyze_bita_forward_dol             --kim kim_original.xml --zhang zhang_original.xml             --output /tmp/kim_zhang_forward_readout.json
      - name: Check committed result before running scientific tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,shutil
          fresh=Path('/tmp/kim_zhang_forward_readout.json')
          frozen=Path('empirical/trait_architecture_history/kim_zhang_forward_dol_readout.json')
          if frozen.exists():
              if json.loads(fresh.read_text())!=json.loads(frozen.read_text()):
                  raise ValueError('committed science readout not reproduced from both original article XMLs')
              print('BITA_FORWARD_FROZEN_ORIGINAL_ROUNDTRIP:PASS')
          else:
              print('BITA_FORWARD_FROZEN_ORIGINAL_ROUNDTRIP:NOT_FROZEN')
              frozen.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(fresh,frozen)
          print('BITA_FORWARD_FULL_SOURCE_JSON:'+json.dumps(json.loads(fresh.read_text()),ensure_ascii=False,separators=(',',':')))
          PY
      - name: Run source-locked unit and descriptive model tests
        run: |
          python -m pip install 'pytest>=8,<10'
          python -m pytest -q tests/test_bita_forward_dol.py
      - uses: actions/upload-artifact@v4
        with:
          name: bita-forward-Kim-Zhang-source-reanalysis
          path: |
            empirical/trait_architecture_history/kim_zhang_forward_dol_readout.json
          if-no-files-found: error
          retention-days: 30
