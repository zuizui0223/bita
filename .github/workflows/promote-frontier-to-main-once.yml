name: promote-frontier-to-main-once

on:
  push:
    branches:
      - analysis/identification-frontier-augmentation-v1

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/identification-frontier-augmentation-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Main promotion
        run: python scripts/promote_frontier_to_main_once.py
      - name: Regenerate identification figures
        run: python scripts/build_identification_design_figures_svg.py
      - name: Install tests
        run: python -m pip install -e '.[dev]'
      - name: Verify promoted scientific contract
        run: |
          pytest -q \
            tests/test_identification_manuscript_draft.py \
            tests/test_identification_manuscript_references.py \
            tests/test_identification_design_figures.py \
            tests/test_identification_candidate_package.py \
            tests/test_identification_frontier_augmentation.py \
            tests/test_hypercube_face_coverage.py \
            tests/test_submission_narrative.py
      - name: Remove one-shot promotion surfaces
        run: |
          rm scripts/promote_frontier_to_main_once.py
          rm .github/workflows/promote-frontier-to-main-once.yml
      - name: Commit promoted Main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Promote identification-frontier face coverage into Main'
          git push origin HEAD:analysis/identification-frontier-augmentation-v1
