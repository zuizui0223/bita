name: patch-frontier-abstract-once

on:
  push:
    branches:
      - analysis/identification-frontier-augmentation-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/identification-frontier-augmentation-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize Abstract and portal metadata
        run: python scripts/patch_frontier_abstract_once.py
      - name: Regenerate Figure 4 from current source
        run: python scripts/build_identification_design_figures_svg.py
      - name: Install tests
        run: python -m pip install -e '.[dev]'
      - name: Verify frontier promotion contracts
        run: |
          pytest -q \
            tests/test_ecology_submission_packaging.py \
            tests/test_mechanism_pattern_identification_bridge.py \
            tests/test_partial_identification_manuscript_integration.py \
            tests/test_theoretical_ecology_house_style.py \
            tests/test_identification_candidate_package.py \
            tests/test_identification_manuscript_references.py \
            tests/test_identification_design_figures.py \
            tests/test_identification_frontier_augmentation.py \
            tests/test_hypercube_face_coverage.py
      - name: Remove one-shot synchronization surfaces
        run: |
          rm scripts/patch_frontier_abstract_once.py
          rm .github/workflows/patch-frontier-abstract-once.yml
      - name: Commit synchronized frontier Main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Synchronize 17-system frontier manuscript and package contracts'
          git push origin HEAD:analysis/identification-frontier-augmentation-v1
