name: bita-pseudomonas-original-source-intake
on:
  push:
    branches: ['analysis/bita-pseudomonas-wt-comparison-20261115']
    paths:
      - '.github/workflows/bita-pseudomonas-original-source-intake.yml'
  pull_request:
    branches: ['analysis/bita-macro-functional-split-20261115']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install XLSX reader
        run: python -m pip install 'openpyxl>=3.1,<4'
      - name: Fetch public Dryad files using their advertised download URLs
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, json, hashlib, os
          from pathlib import Path
          from openpyxl import load_workbook
          root=Path('dryad_source');root.mkdir(exist_ok=True)
          base='https://datadryad.org'
          url=base+'/api/v2/versions/167943/files'
          headers={'User-Agent':'BITA-public-data-reproducibility/1.0 (public source, no auth)', 'Accept':'application/json'}
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as r:
              inventory=json.load(r)
          files=inventory.get('_embedded',{}).get('stash:files',[])
          meta=[]
          for item in files:
              name=item['path']
              target=root/name
              download=item.get('_links',{}).get('stash:download',{}).get('href')
              record={'path':name,'size_expected':item.get('size'),'sha256_expected':item.get('digest'),
                      'id':item.get('id'),'download_link':download}
              if not download:raise ValueError('No advertised public file download link: '+name)
              full=download if download.startswith('https://') else base+download
              try:
                  req=urllib.request.Request(full,headers={'User-Agent':'BITA-public-data-reproducibility/1.0'})
                  with urllib.request.urlopen(req,timeout=60) as r:
                      raw=r.read(1500000)
                      record['http_status']=r.status
              except urllib.error.HTTPError as ex:
                  record['http_status']=ex.code
                  record['error']=ex.reason
                  meta.append(record)
                  print('BITA_FILE_FAILURE:'+json.dumps(record),flush=True)
                  continue
              record['download_bytes']=len(raw)
              record['download_sha256']=hashlib.sha256(raw).hexdigest()
              if len(raw)!=item['size'] or record['download_sha256']!=item['digest']:
                  raise ValueError('Original Dryad checksum/size mismatch: '+name)
              target.write_bytes(raw)
              if name.endswith('.xlsx'):
                  wb=load_workbook(target,read_only=True,data_only=True)
                  sheets=[]
                  for ws in wb:
                      preview=[]
                      for row in ws.iter_rows(min_row=1,max_row=min(18,ws.max_row),max_col=min(20,ws.max_column),values_only=True):
                          preview.append([str(v)[:140] if v is not None else None for v in row])
                      sheets.append({'name':ws.title,'rows':ws.max_row,'columns':ws.max_column,'preview':preview})
                  record['sheets']=sheets
              if name.endswith('.txt'):
                  record['readme_text']=raw.decode('utf-8-sig','replace')[:10000]
              meta.append(record)
              print('BITA_DRYAD_FILE_METADATA:'+json.dumps(record,ensure_ascii=False),flush=True)
          (root/'manifest.json').write_text(json.dumps({'dataset_doi':'10.5061/dryad.2bvq83bs4',
                                                       'version_id':167943,'files':meta},indent=2,ensure_ascii=False))
          if not any('sheets' in f for f in meta):
              raise ValueError('No published original XLSX bytes retrieved')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bita-pseudomonas-dryad-original-sources
          path: dryad_source/
          if-no-files-found: error
          retention-days: 30
