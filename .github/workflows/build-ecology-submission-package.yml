name: build-ecology-submission-package

on:
  pull_request:
    paths:
      - 'manuscript/**'
      - 'submission/**'
      - 'scripts/build_ecology_submission_sources.py'
      - 'scripts/format_ecology_submission_docx.py'
      - 'tests/test_ecology_submission_packaging.py'
      - '.github/workflows/build-ecology-submission-package.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install document toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice-writer poppler-utils
          python -m pip install python-docx pytest

      - name: Run packaging regression tests
        run: python -m pytest -q tests/test_ecology_submission_packaging.py

      - name: Build Ecology submission sources
        run: python scripts/build_ecology_submission_sources.py

      - name: Build Main Document DOCX
        run: |
          cd submission/ecology/generated
          pandoc MANUSCRIPT_ECOLOGY_SUBMISSION.md \
            --from=markdown+tex_math_single_backslash \
            --to=docx \
            --output=MANUSCRIPT_ECOLOGY_RAW.docx
          cd ../../..
          python scripts/format_ecology_submission_docx.py \
            submission/ecology/generated/MANUSCRIPT_ECOLOGY_RAW.docx \
            submission/ecology/generated/MANUSCRIPT_ECOLOGY_SUBMISSION.docx

      - name: Build Appendix S1 PDF source
        run: |
          cd submission/ecology/generated
          pandoc APPENDIX_S1.md \
            --from=markdown+tex_math_single_backslash \
            --to=docx \
            --output=APPENDIX_S1_RAW.docx
          cd ../../..
          python scripts/format_ecology_submission_docx.py \
            submission/ecology/generated/APPENDIX_S1_RAW.docx \
            submission/ecology/generated/APPENDIX_S1.docx \
            --appendix

      - name: Render Main Document and Appendix
        run: |
          mkdir -p submission/ecology/generated/rendered
          libreoffice --headless --convert-to pdf \
            --outdir submission/ecology/generated/rendered \
            submission/ecology/generated/MANUSCRIPT_ECOLOGY_SUBMISSION.docx
          libreoffice --headless --convert-to pdf \
            --outdir submission/ecology/generated/rendered \
            submission/ecology/generated/APPENDIX_S1.docx

      - name: Validate package and page limits
        run: |
          MAIN_PDF=submission/ecology/generated/rendered/MANUSCRIPT_ECOLOGY_SUBMISSION.pdf
          APP_PDF=submission/ecology/generated/rendered/APPENDIX_S1.pdf
          test -s "$MAIN_PDF"
          test -s "$APP_PDF"
          MAIN_PAGES=$(pdfinfo "$MAIN_PDF" | awk '/^Pages:/ {print $2}')
          APP_PAGES=$(pdfinfo "$APP_PDF" | awk '/^Pages:/ {print $2}')
          if [ "$MAIN_PAGES" -gt 50 ]; then
            echo "Main Document is $MAIN_PAGES pages; Ecology Concepts & Synthesis maximum is 50." >&2
            exit 1
          fi
          if [ "$MAIN_PAGES" -gt 30 ]; then
            LENGTH_STATE='OVER_30_REQUIRES_TWO_PART_COVER_JUSTIFICATION'
          else
            LENGTH_STATE='WITHIN_30_PAGE_STANDARD_LIMIT'
          fi
          pdftotext "$MAIN_PDF" - | grep -q 'Ecology'
          pdftotext "$MAIN_PDF" - | grep -q 'Concepts & Synthesis'
          pdftotext "$APP_PDF" - | grep -q 'Appendix S1'
          pdftotext "$APP_PDF" - | grep -q 'Figure S4'
          {
            echo "main_pages=$MAIN_PAGES"
            echo "appendix_pages=$APP_PAGES"
            echo "length_state=$LENGTH_STATE"
            echo "main_format=Word DOCX, Letter, 1-inch margins, 12-pt Times New Roman, double-spaced prose"
            echo "line_number_scope=after title page through end of References"
            echo "appendix_format=single Appendix S1 PDF; no spreadsheet Supporting Information"
            echo "open_research_data=machine-readable CSV package separated from Supporting Information"
          } > submission/ecology/generated/PACKAGE_QA_RECEIPT.txt

      - name: Remove raw intermediate Word files
        run: |
          rm -f submission/ecology/generated/MANUSCRIPT_ECOLOGY_RAW.docx
          rm -f submission/ecology/generated/APPENDIX_S1_RAW.docx

      - name: Upload submission package
        uses: actions/upload-artifact@v4
        with:
          name: ecology-submission-package
          path: |
            submission/ecology/generated/MANUSCRIPT_ECOLOGY_SUBMISSION.docx
            submission/ecology/generated/rendered/MANUSCRIPT_ECOLOGY_SUBMISSION.pdf
            submission/ecology/generated/rendered/APPENDIX_S1.pdf
            submission/ecology/generated/OPEN_RESEARCH_DATA_MANIFEST.md
            submission/ecology/generated/open_research_data/*.csv
            submission/ecology/generated/PACKAGE_QA_RECEIPT.txt
          if-no-files-found: error
