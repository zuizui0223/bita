name: build-ecology-submission-package

on:
  pull_request:
    paths:
      - 'manuscript/**'
      - 'submission/**'
      - 'scripts/build_ecology_submission_sources.py'
      - 'scripts/build_ecology_review_package_sources.py'
      - 'scripts/build_identification_candidate_package_sources.py'
      - 'scripts/format_ecology_submission_docx.py'
      - 'tests/test_ecology_submission_packaging.py'
      - 'tests/test_identification_candidate_package.py'
      - '.github/workflows/build-ecology-submission-package.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install document toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice-writer poppler-utils librsvg2-bin
          python -m pip install python-docx pytest

      - name: Run canonical packaging regression tests
        run: |
          python -m pytest -q \
            tests/test_ecology_submission_packaging.py \
            tests/test_identification_candidate_package.py \
            tests/test_identification_manuscript_draft.py \
            tests/test_identification_manuscript_references.py \
            tests/test_identification_design_figures.py

      - name: Build canonical Ecology sources from identification manuscript
        run: python scripts/build_ecology_review_package_sources.py

      - name: Build Main Document DOCX
        run: |
          cd submission/ecology/generated
          pandoc MANUSCRIPT_ECOLOGY_SUBMISSION.md \
            --from=markdown+tex_math_single_backslash \
            --to=docx \
            --output=MANUSCRIPT_ECOLOGY_RAW.docx
          cd ../../..
          python scripts/format_ecology_submission_docx.py \
            submission/ecology/generated/MANUSCRIPT_ECOLOGY_RAW.docx \
            submission/ecology/generated/MANUSCRIPT_ECOLOGY_SUBMISSION.docx

      - name: Build Appendix S1 DOCX
        run: |
          cd submission/ecology/generated
          pandoc APPENDIX_S1.md \
            --from=markdown+tex_math_single_backslash \
            --to=docx \
            --output=APPENDIX_S1_RAW.docx
          cd ../../..
          python scripts/format_ecology_submission_docx.py \
            submission/ecology/generated/APPENDIX_S1_RAW.docx \
            submission/ecology/generated/APPENDIX_S1.docx \
            --appendix

      - name: Validate DOCX structure and embedded figures
        run: |
          mkdir -p /tmp/ecology-docx
          cd /tmp/ecology-docx
          unzip -q "$GITHUB_WORKSPACE/submission/ecology/generated/MANUSCRIPT_ECOLOGY_SUBMISSION.docx"
          grep -q 'w:lnNumType' word/document.xml
          ! grep -q 'ECOLOGY_SECTION_BREAK' word/document.xml
          ! grep -q 'ECOLOGY_PAGE_BREAK' word/document.xml
          cd "$GITHUB_WORKSPACE"
          MEDIA_COUNT=$(unzip -l submission/ecology/generated/MANUSCRIPT_ECOLOGY_SUBMISSION.docx | grep -c 'word/media/' || true)
          if [ "$MEDIA_COUNT" -lt 5 ]; then
            echo "Expected five embedded identification-design Main figures; found $MEDIA_COUNT" >&2
            exit 1
          fi

      - name: Render Main Document and Appendix
        run: |
          mkdir -p submission/ecology/generated/rendered
          libreoffice --headless --convert-to pdf \
            --outdir submission/ecology/generated/rendered \
            submission/ecology/generated/MANUSCRIPT_ECOLOGY_SUBMISSION.docx
          libreoffice --headless --convert-to pdf \
            --outdir submission/ecology/generated/rendered \
            submission/ecology/generated/APPENDIX_S1.docx

      - name: Validate canonical identification package and page limits
        run: |
          MAIN_PDF=submission/ecology/generated/rendered/MANUSCRIPT_ECOLOGY_SUBMISSION.pdf
          APP_PDF=submission/ecology/generated/rendered/APPENDIX_S1.pdf
          MAIN_TXT="$RUNNER_TEMP/main.txt"
          APP_TXT="$RUNNER_TEMP/appendix.txt"
          test -s "$MAIN_PDF"
          test -s "$APP_PDF"
          MAIN_PAGES=$(pdfinfo "$MAIN_PDF" | awk '/^Pages:/ {print $2}')
          APP_PAGES=$(pdfinfo "$APP_PDF" | awk '/^Pages:/ {print $2}')
          pdftotext "$MAIN_PDF" "$MAIN_TXT"
          pdftotext "$APP_PDF" "$APP_TXT"

          grep -q 'From floral trait interactions to mechanism identification' "$MAIN_TXT"
          grep -qi 'crossed intervention design' "$MAIN_TXT"
          grep -q 'Kessler et al. (2008)' "$MAIN_TXT"
          grep -q 'Egan et al. (2021)' "$MAIN_TXT"
          grep -q 'Figure 5.' "$MAIN_TXT"
          ! grep -q 'Theorem 1' "$MAIN_TXT"
          ! grep -q '77.2%' "$MAIN_TXT"
          grep -q 'Appendix S1' "$APP_TXT"
          grep -q '2,592' "$APP_TXT"
          grep -q '77.2%' "$APP_TXT"
          grep -q 'Kessler et al. 2008 aggregate reconstruction' "$APP_TXT"
          test -s submission/ecology/generated/open_research_data/high_information_identification_coverage.csv
          test -s submission/ecology/generated/open_research_data/impatiens_identification_retrofit.json

          if [ "$MAIN_PAGES" -le 30 ]; then
            LENGTH_STATE='WITHIN_30_PAGE_STANDARD_TARGET'
          elif [ "$MAIN_PAGES" -le 50 ]; then
            LENGTH_STATE='OVER_30_REQUIRES_TWO_PART_COVER_JUSTIFICATION'
          else
            LENGTH_STATE='FAIL_OVER_50'
          fi
          if [ "$MAIN_PAGES" -gt 50 ]; then
            echo "Main Document is $MAIN_PAGES pages; Ecology Concepts & Synthesis maximum is 50." >&2
            exit 1
          fi

          MEDIA_COUNT=$(unzip -l submission/ecology/generated/MANUSCRIPT_ECOLOGY_SUBMISSION.docx | grep -c 'word/media/' || true)
          {
            echo "main_pages=$MAIN_PAGES"
            echo "appendix_pages=$APP_PAGES"
            echo "length_state=$LENGTH_STATE"
            echo "limit_state=PASS_AT_OR_BELOW_50"
            echo "canonical_manuscript=manuscript/MANUSCRIPT_IDENTIFICATION_DESIGN.md"
            echo "main_headline=interaction_detection_to_mechanism_identification"
            echo "main_figures=5 identification-design figures embedded"
            echo "embedded_main_media=$MEDIA_COUNT"
            echo "old_grid_status=supplement_only"
            echo "open_research_identification_outputs=present"
          } > submission/ecology/generated/PACKAGE_QA_RECEIPT.txt

      - name: Remove raw intermediate Word files
        if: always()
        run: |
          rm -f submission/ecology/generated/MANUSCRIPT_ECOLOGY_RAW.docx
          rm -f submission/ecology/generated/APPENDIX_S1_RAW.docx

      - name: Upload canonical review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecology-submission-package
          path: |
            submission/ecology/generated/MANUSCRIPT_ECOLOGY_SUBMISSION.docx
            submission/ecology/generated/APPENDIX_S1.docx
            submission/ecology/generated/rendered/MANUSCRIPT_ECOLOGY_SUBMISSION.pdf
            submission/ecology/generated/rendered/APPENDIX_S1.pdf
            submission/ecology/generated/OPEN_RESEARCH_DATA_MANIFEST.md
            submission/ecology/generated/open_research_data/*
            submission/ecology/generated/PACKAGE_QA_RECEIPT.txt
          if-no-files-found: error
