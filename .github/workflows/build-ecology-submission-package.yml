name: legacy-ecology-submission-package-guard

on:
  pull_request:
    paths:
      - 'manuscript/**'
      - 'submission/**'
      - 'docs/SUBMISSION_SCOPE.md'
      - 'docs/CHAPTER2_SUBMISSION_SCOPE_V1.md'
      - 'scripts/build_bita_mechanism_candidate_sources.py'
      - 'tests/test_trait_differentiation*.py'
      - '.github/workflows/build-ecology-submission-package.yml'
      - '.github/workflows/build-bita-mechanism-review-package.yml'
  workflow_dispatch:

jobs:
  legacy-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirm Letter is current while synthesis and mechanism packages are preserved
        run: |
          grep -q 'PRIMARY_FORWARD_PAPER = ACCESS_ROUTING_LETTER' docs/SUBMISSION_SCOPE.md
          grep -q 'Ecology Letters' docs/SUBMISSION_SCOPE.md
          test -f manuscript/MANUSCRIPT_ACCESS_ROUTING_LETTER_V0.md
          test -f manuscript/MANUSCRIPT_FLORAL_DEFENCE_SELECTIVITY_V0.md
          test -f manuscript/MANUSCRIPT_TRAIT_DIFFERENTIATION_V1.md

      - name: Confirm legacy mechanism-identification package remains reproducible
        run: |
          grep -q 'Trait interaction is not ecological mechanism' manuscript/MANUSCRIPT_TRAIT_DIFFERENTIATION_V1.md
          test -f scripts/build_bita_mechanism_candidate_sources.py
          test -f .github/workflows/build-bita-mechanism-review-package.yml

      - name: Record routing decision
        run: |
          echo 'Access-routing Letter is the primary forward BITA submission; the macro Synthesis is preserved in reserve.'
          echo 'Mechanism-identification package remains preserved as legacy/supporting inference.'
