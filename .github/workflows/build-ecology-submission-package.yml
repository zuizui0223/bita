name: legacy-ecology-submission-package-guard

on:
  pull_request:
    paths:
      - 'manuscript/**'
      - 'submission/**'
      - 'docs/SUBMISSION_SCOPE.md'
      - 'docs/CHAPTER2_SUBMISSION_SCOPE_V1.md'
      - 'scripts/build_bita_mechanism_candidate_sources.py'
      - 'tests/test_trait_differentiation*.py'
      - '.github/workflows/build-ecology-submission-package.yml'
      - '.github/workflows/build-bita-mechanism-review-package.yml'
  workflow_dispatch:

jobs:
  legacy-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirm stale integrated package is not canonical
        run: |
          grep -q 'OLD_PACKAGE_STALE' docs/SUBMISSION_SCOPE.md
          grep -q 'REBUILD_REQUIRED_BEFORE_SUBMISSION' docs/SUBMISSION_SCOPE.md
          grep -q 'The active paper is no longer the general architecture-value paper' docs/SUBMISSION_SCOPE.md

      - name: Confirm current mechanism-identification submission route
        run: |
          grep -q 'Trait interaction is not ecological mechanism' manuscript/MANUSCRIPT_TRAIT_DIFFERENTIATION_V1.md
          test -f scripts/build_bita_mechanism_candidate_sources.py
          test -f .github/workflows/build-bita-mechanism-review-package.yml
          grep -q 'bita-mechanism-identification-review-package' .github/workflows/build-bita-mechanism-review-package.yml

      - name: Record routing decision
        run: |
          echo 'Legacy integrated Ecology package is intentionally retired.'
          echo 'Active review package is built by build-bita-mechanism-review-package.yml.'
