name: compact-partial-identification-main-once

on:
  push:
    branches:
      - analysis/partial-identification-frontier-v1

permissions:
  contents: write

jobs:
  compact:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/partial-identification-frontier-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compact non-core Main prose
        run: python scripts/compact_partial_identification_main_once.py
      - name: Verify core claims survived compaction
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('manuscript/MANUSCRIPT_IDENTIFICATION_DESIGN.md').read_text()
          required = [
              r'\mathcal I(\delta)',
              r'\rho_\Delta-\iota_\Delta\ge\Delta_{AD}W',
              '56 directional route records from 25 independent biological study clusters',
              'design fragmentation',
              'Kessler et al. (2008)',
              'Egan et al. (2021)',
              'Soper Gorden and Adler (2018)',
              'interaction detection → partial identification → mechanism identification',
          ]
          for token in required:
              assert token in text, token
          assert 'Theorem 1' not in text
          assert '77.2%' not in text
          PY
      - name: Remove one-shot compaction surfaces
        run: |
          rm scripts/compact_partial_identification_main_once.py
          rm .github/workflows/compact-partial-identification-main-once.yml
      - name: Commit compacted Main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Compact partial-identification Main without dropping results'
          git push origin HEAD:analysis/partial-identification-frontier-v1
