name: Validate third-network synthetic E2E

on:
  push:
    branches:
      - main
    paths:
      - "scripts/run_third_network_synthetic_e2e.py"
      - "scripts/run_third_network_release_rehearsal.py"
      - "scripts/reproduce_third_network_confirmatory_release.py"
      - "scripts/verify_third_network_confirmatory_release.py"
      - "scripts/package_third_network_confirmatory_release.py"
      - "scripts/evaluate_third_network_route_blind_presurvey.py"
      - "scripts/evaluate_third_network_field_readiness.py"
      - "scripts/validate_third_network_confirmatory_freeze.py"
      - "scripts/evaluate_third_network_route_reliability.py"
      - "scripts/freeze_third_network_confirmatory_inputs.py"
      - "scripts/build_third_access_routing_units.py"
      - "scripts/analyze_third_access_routing_network.py"
      - "scripts/analyze_joint_access_routing_k3.py"
      - "scripts/run_third_network_confirmatory_pipeline.py"
      - "scripts/verify_third_network_confirmatory_bundle.py"
      - "scripts/plan_third_network_claim_transition.py"
      - "tests/test_third_network_confirmatory_pipeline.py"
      - "tests/test_third_network_confirmatory_bundle_verifier.py"
      - "tests/test_third_network_claim_transition.py"
      - "tests/test_third_network_synthetic_e2e.py"
      - "tests/test_third_network_release_rehearsal.py"
      - "tests/test_third_network_release_package.py"
      - "tests/test_third_network_release_verifier.py"
      - "tests/test_third_network_scope_registration.py"
      - "tests/test_third_network_route_reliability.py"
      - "tests/test_third_network_input_freeze.py"
      - "empirical/floral_defence_selectivity/THIRD_NETWORK_*"
      - "empirical/floral_defence_selectivity/THIRD_NETWORK_CONFIRMATORY_RELEASE_PACKAGE_V1.md"
      - "empirical/floral_defence_selectivity/THIRD_NETWORK_RELEASE_CODE_MANIFEST_V1.txt"
      - ".github/workflows/test-third-network-synthetic-e2e.yml"
  pull_request:
    paths:
      - "scripts/run_third_network_synthetic_e2e.py"
      - "scripts/run_third_network_release_rehearsal.py"
      - "scripts/reproduce_third_network_confirmatory_release.py"
      - "scripts/verify_third_network_confirmatory_release.py"
      - "scripts/package_third_network_confirmatory_release.py"
      - "scripts/evaluate_third_network_route_blind_presurvey.py"
      - "scripts/evaluate_third_network_field_readiness.py"
      - "scripts/validate_third_network_confirmatory_freeze.py"
      - "scripts/evaluate_third_network_route_reliability.py"
      - "scripts/freeze_third_network_confirmatory_inputs.py"
      - "scripts/build_third_access_routing_units.py"
      - "scripts/analyze_third_access_routing_network.py"
      - "scripts/analyze_joint_access_routing_k3.py"
      - "scripts/run_third_network_confirmatory_pipeline.py"
      - "scripts/verify_third_network_confirmatory_bundle.py"
      - "scripts/plan_third_network_claim_transition.py"
      - "tests/test_third_network_confirmatory_pipeline.py"
      - "tests/test_third_network_confirmatory_bundle_verifier.py"
      - "tests/test_third_network_claim_transition.py"
      - "tests/test_third_network_synthetic_e2e.py"
      - "tests/test_third_network_release_rehearsal.py"
      - "tests/test_third_network_release_package.py"
      - "tests/test_third_network_release_verifier.py"
      - "tests/test_third_network_scope_registration.py"
      - "tests/test_third_network_route_reliability.py"
      - "tests/test_third_network_input_freeze.py"
      - "empirical/floral_defence_selectivity/THIRD_NETWORK_*"
      - "empirical/floral_defence_selectivity/THIRD_NETWORK_CONFIRMATORY_RELEASE_PACKAGE_V1.md"
      - "empirical/floral_defence_selectivity/THIRD_NETWORK_RELEASE_CODE_MANIFEST_V1.txt"
      - ".github/workflows/test-third-network-synthetic-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e '.[dev]'

      - name: Run focused contracts
        run: |
          pytest -q \
            tests/test_third_network_confirmatory_freeze.py \
            tests/test_third_network_route_blind_presurvey.py \
            tests/test_third_network_field_readiness.py \
            tests/test_third_network_route_reliability.py \
            tests/test_third_network_input_freeze.py \
            tests/test_third_access_routing_unit_builder.py \
            tests/test_prospective_third_access_routing_network.py \
            tests/test_third_network_synthetic_e2e.py \
            tests/test_third_network_confirmatory_pipeline.py \
            tests/test_third_network_confirmatory_bundle_verifier.py \
            tests/test_third_network_claim_transition.py \
            tests/test_third_network_release_rehearsal.py \
            tests/test_third_network_release_package.py \
            tests/test_third_network_release_verifier.py \
            tests/test_third_network_scope_registration.py

      - name: Verify production CLI entry points
        run: |
          python scripts/run_third_network_confirmatory_pipeline.py --help >/dev/null
          python scripts/verify_third_network_confirmatory_bundle.py --help >/dev/null
          python scripts/plan_third_network_claim_transition.py --help >/dev/null
          python scripts/run_third_network_release_rehearsal.py --help >/dev/null
          python scripts/package_third_network_confirmatory_release.py --help >/dev/null
          python scripts/reproduce_third_network_confirmatory_release.py --help >/dev/null
          python scripts/verify_third_network_confirmatory_release.py --help >/dev/null

      - name: Run synthetic E2E scenario matrix
        run: |
          for scenario in positive null opposite; do
            python scripts/run_third_network_synthetic_e2e.py \
              --output-dir "artifacts/third_network_synthetic_e2e/$scenario" \
              --permutations 99 \
              --scenario "$scenario"
          done

      - name: Verify development-only scenario receipts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          receipts = {}
          for scenario in ("positive", "null", "opposite"):
              path = Path(
                  f"artifacts/third_network_synthetic_e2e/{scenario}/synthetic_e2e_receipt.json"
              )
              receipt = json.loads(path.read_text(encoding="utf-8"))
              assert receipt["receipt"] == "BITA_THIRD_NETWORK_SYNTHETIC_E2E_V1"
              assert receipt["status"] == "PASS"
              assert receipt["mode"] == "DEVELOPMENT_ONLY_SYNTHETIC"
              assert receipt["scientific_claim_allowed"] is False
              assert receipt["scenario"] == scenario
              assert receipt["route_reliability_status"] == "ROUTE_RELIABILITY_PASS"
              assert receipt["route_reliability_kappa"] >= 0.8
              assert receipt["analysis_units"] == 72
              assert receipt["third_network_status"] == "CONFIRMATORY_GATE_PASS"
              assert receipt["k3_network_count"] == 3
              receipts[scenario] = receipt

          assert receipts["positive"]["third_network_rho"] > 0
          assert abs(receipts["null"]["third_network_rho"]) < 0.1
          assert receipts["opposite"]["third_network_rho"] < 0
          assert (
              receipts["opposite"]["k3_direction_concordance"]
              == "not_3_of_3_positive"
          )
          print("Synthetic E2E positive/null/opposite matrix + coder reliability verified")
          PY

      - name: Run release-chain rehearsal matrix
        run: |
          for scenario in positive null opposite; do
            python scripts/run_third_network_release_rehearsal.py \
              --output-dir "artifacts/third_network_release_rehearsal/$scenario" \
              --permutations 49 \
              --scenario "$scenario"
          done

      - name: Verify release-chain rehearsal receipts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          receipts = {}
          for scenario in ("positive", "null", "opposite"):
              root = Path(f"artifacts/third_network_release_rehearsal/{scenario}")
              receipt = json.loads(
                  (root / "release_rehearsal_receipt.json").read_text(encoding="utf-8")
              )
              assert receipt["receipt"] == "BITA_THIRD_NETWORK_RELEASE_REHEARSAL_V1"
              assert receipt["status"] == "PASS"
              assert receipt["mode"] == "DEVELOPMENT_ONLY_SYNTHETIC_RELEASE_REHEARSAL"
              assert receipt["scientific_claim_allowed"] is False
              assert receipt["automatic_manuscript_edit_permitted"] is False
              assert receipt["bundle_verification_status"] == "CONFIRMATORY_BUNDLE_VERIFIED"
              assert receipt["source_recheck_mode"] == "SOURCE_INPUTS_RECHECKED"
              assert receipt["existing_network_inputs_verified"] is True
              assert receipt["third_network_must_be_retained"] is True
              assert (root / "confirmatory_bundle" / "BUNDLE_SHA256SUMS.txt").is_file()
              receipts[scenario] = receipt

          assert receipts["positive"]["third_network_rho"] > 0
          assert receipts["positive"]["claim_transition_state"] == (
              "THREE_NETWORK_DIRECTIONAL_CONCORDANCE"
          )
          assert abs(receipts["null"]["third_network_rho"]) < 0.1
          assert receipts["opposite"]["third_network_rho"] < 0
          assert receipts["opposite"]["claim_transition_state"] == (
              "THREE_NETWORK_DIRECTIONAL_NONCONCORDANCE"
          )
          print("Release rehearsal matrix verified")
          PY

      - name: Run deterministic release-package + verification + offline replay matrix
        run: |
          mkdir -p artifacts/third_network_release_verification
          mkdir -p artifacts/third_network_release_reproduction

          for scenario in positive null opposite; do
            python scripts/package_third_network_confirmatory_release.py \
              "artifacts/third_network_release_rehearsal/$scenario/confirmatory_bundle" \
              --source-dir "artifacts/third_network_release_rehearsal/$scenario/synthetic_fixture" \
              --output-dir "artifacts/third_network_release_package/$scenario" \
              --development-only

            PYTHONPATH=. python scripts/verify_third_network_confirmatory_release.py \
              "artifacts/third_network_release_package/$scenario" \
              --zip "artifacts/third_network_release_package/$scenario.zip" \
              --zip-sha256-receipt "artifacts/third_network_release_package/$scenario.zip.sha256" \
              --output "artifacts/third_network_release_verification/$scenario.json"

            PYTHONPATH=. python scripts/reproduce_third_network_confirmatory_release.py \
              "artifacts/third_network_release_package/$scenario" \
              --output "artifacts/third_network_release_reproduction/$scenario.json"
          done

      - name: Verify release-package verification + replay receipts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for scenario in ("positive", "null", "opposite"):
              root = Path(f"artifacts/third_network_release_package/{scenario}")
              manifest = json.loads((root / "release_manifest.json").read_text(encoding="utf-8"))
              verification = json.loads(
                  Path(f"artifacts/third_network_release_verification/{scenario}.json").read_text(encoding="utf-8")
              )
              replay = json.loads(
                  Path(f"artifacts/third_network_release_reproduction/{scenario}.json").read_text(encoding="utf-8")
              )
              zip_path = Path(str(root) + ".zip")
              sha_path = Path(str(zip_path) + ".sha256")

              assert manifest["receipt"] == "BITA_THIRD_NETWORK_CONFIRMATORY_RELEASE_PACKAGE_V1"
              assert manifest["status"] == "RELEASE_PACKAGE_READY"
              assert manifest["mode"] == "DEVELOPMENT_ONLY_SYNTHETIC"
              assert manifest["scientific_claim_allowed_by_archive_alone"] is False
              assert manifest["claim_transition_plan_ready"] is True
              assert manifest["automatic_manuscript_edit_permitted"] is False
              assert manifest["existing_network_inputs_verified"] is True

              assert verification["receipt"] == "BITA_THIRD_NETWORK_CONFIRMATORY_RELEASE_VERIFICATION_V1"
              assert verification["status"] == "CONFIRMATORY_RELEASE_VERIFIED"
              assert verification["failures"] == []
              assert verification["nested_bundle_verification"]["status"] == "CONFIRMATORY_BUNDLE_VERIFIED"
              assert verification["nested_bundle_verification"]["source_recheck_mode"] == "SOURCE_INPUTS_RECHECKED"
              assert verification["zip_verification"]["zip_sha256_match"] is True

              assert replay["receipt"] == "BITA_THIRD_NETWORK_RELEASE_REPRODUCTION_V1"
              assert replay["status"] == "REPRODUCTION_MATCH"
              assert replay["bundle_verification_status"] == "CONFIRMATORY_BUNDLE_VERIFIED"
              assert replay["source_recheck_mode"] == "SOURCE_INPUTS_RECHECKED"
              assert all(replay["third_network_matches"].values())
              assert all(replay["joint_k3_matches"].values())

              assert zip_path.is_file() and zip_path.stat().st_size > 0
              assert sha_path.is_file() and sha_path.stat().st_size > 0

          print("Deterministic package + release verification + offline replay matrix verified")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: third-network-confirmatory-release-package
          path: |
            artifacts/third_network_release_package
            artifacts/third_network_release_package/*.zip
            artifacts/third_network_release_package/*.zip.sha256
            artifacts/third_network_release_verification
            artifacts/third_network_release_reproduction
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: third-network-release-rehearsal
          path: artifacts/third_network_release_rehearsal
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: third-network-synthetic-e2e
          path: artifacts/third_network_synthetic_e2e
          if-no-files-found: error
