name: Analyze Case 2026 public k3 replication

on:
  pull_request:
    paths:
      - "scripts/analyze_case2026_hawaii_replication.py"
      - "tests/test_case2026_hawaii_replication.py"
      - ".github/workflows/analyze-case2026-public-k3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  case2026:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and tests
        run: python -m pip install -e '.[dev]'

      - name: Test fail-closed Case replication contract
        run: pytest -q tests/test_case2026_hawaii_replication.py

      - name: Run real Dryad Case 2026 replication and k3 synthesis
        run: |
          set -o pipefail
          mkdir -p artifacts/case2026
          python -m scripts.analyze_case2026_hawaii_replication \
            artifacts/case2026/case2026_hawaii_postpublication_k3.json \
            --permutations 9999 | tee artifacts/case2026/run.log

      - name: Print compact result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/case2026/case2026_hawaii_postpublication_k3.json")
          x = json.loads(p.read_text())
          print(json.dumps({
              "audit": x["audit"],
              "case_network": x["case_network"],
              "postpublication_k3": x["postpublication_k3"],
          }, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: case2026-postpublication-k3
          path: artifacts/case2026
          if-no-files-found: error
