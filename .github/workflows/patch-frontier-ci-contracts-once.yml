name: patch-frontier-ci-contracts-once

on:
  push:
    branches:
      - analysis/identification-frontier-augmentation-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/identification-frontier-augmentation-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch contracts
        run: python scripts/patch_frontier_ci_contracts_once.py
      - name: Verify focused contracts
        run: |
          python -m pip install -e '.[dev]'
          pytest -q \
            tests/test_identification_coverage.py \
            tests/test_identification_design_figures.py \
            tests/test_ecology_concepts_synthesis_fit.py \
            tests/test_larceny_local_reproducibility_contract.py \
            tests/test_mechanism_meta_structure.py \
            tests/test_mechanism_pattern_identification_bridge.py \
            tests/test_partial_identification_manuscript_integration.py \
            tests/test_submission_narrative.py
      - name: Remove one-shot patch surfaces
        run: |
          rm scripts/patch_frontier_ci_contracts_once.py
          rm .github/workflows/patch-frontier-ci-contracts-once.yml
      - name: Commit synchronized contracts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Synchronize frontier CI contracts with current scientific state'
          git push origin HEAD:analysis/identification-frontier-augmentation-v1
