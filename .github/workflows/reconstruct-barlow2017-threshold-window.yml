name: Reconstruct Barlow 2017 threshold window

on:
  pull_request:
    paths:
      - "empirical/mechanism_pattern_synthesis/BARLOW_2017_QUANT_PROTOCOL_V1.md"
      - "scripts/reconstruct_barlow2017_threshold_window.py"
      - ".github/workflows/reconstruct-barlow2017-threshold-window.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reconstruct field and laboratory lanes
        run: |
          python scripts/reconstruct_barlow2017_threshold_window.py artifacts/barlow2017_threshold_window.json
      - uses: actions/upload-artifact@v4
        with:
          name: barlow2017-threshold-window
          path: artifacts/barlow2017_threshold_window.json
          if-no-files-found: error
