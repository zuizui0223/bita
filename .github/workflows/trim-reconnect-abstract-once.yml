name: trim-reconnect-abstract-once

on:
  push:
    branches:
      - manuscript/mechanism-pattern-reconnect-v1
    paths:
      - scripts/trim_reconnect_abstract_once.py
      - .github/workflows/trim-reconnect-abstract-once.yml

permissions:
  contents: write

jobs:
  trim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: manuscript/mechanism-pattern-reconnect-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Trim abstract while retaining mechanism-pattern bridge
        run: python scripts/trim_reconnect_abstract_once.py
      - name: Check abstract length and bridge
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          text=Path('manuscript/MANUSCRIPT_IDENTIFICATION_DESIGN.md').read_text()
          abstract=text.split('## Abstract\n\n',1)[1].split('\n\n**Keywords:**',1)[0]
          n=len(re.findall(r'\b[\w+×-]+\b',abstract))
          print('abstract_words',n)
          assert 150 <= n <= 350
          assert '56 route records from 25 independent biological clusters' in abstract
          assert 'this establishes recurrence, not channel identification' in abstract
          PY
      - name: Commit abstract trim
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manuscript/MANUSCRIPT_IDENTIFICATION_DESIGN.md
          git commit -m 'Tighten mechanism-pattern bridge in abstract'
          git push origin HEAD:manuscript/mechanism-pattern-reconnect-v1
