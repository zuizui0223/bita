name: Apply source eligibility batches

on:
  push:
    branches:
      - analysis/formal-biblio-openalex-fetch-v1
    paths:
      - .github/workflows/apply-direct-access-geometry-source-eligibility.yml
      - scripts/apply_direct_access_geometry_source_eligibility.py
      - empirical/floral_defence_selectivity/formal_bibliographic_frame_v2/DIRECT_ACCESS_GEOMETRY_SOURCE_ELIGIBILITY_BATCH1_V1.csv
      - empirical/floral_defence_selectivity/formal_bibliographic_frame_v2/DIRECT_ACCESS_GEOMETRY_SOURCE_ELIGIBILITY_BATCH2_V1.csv
      - empirical/floral_defence_selectivity/formal_bibliographic_frame_v2/DIRECT_ACCESS_GEOMETRY_ELIGIBILITY_DECISIONS_V3.csv

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply direction-blind source adjudications
        run: |
          python scripts/apply_direct_access_geometry_source_eligibility.py \
            --decisions empirical/floral_defence_selectivity/formal_bibliographic_frame_v2/DIRECT_ACCESS_GEOMETRY_ELIGIBILITY_DECISIONS_V3.csv \
            --adjudication empirical/floral_defence_selectivity/formal_bibliographic_frame_v2/DIRECT_ACCESS_GEOMETRY_SOURCE_ELIGIBILITY_BATCH1_V1.csv \
            --adjudication empirical/floral_defence_selectivity/formal_bibliographic_frame_v2/DIRECT_ACCESS_GEOMETRY_SOURCE_ELIGIBILITY_BATCH2_V1.csv \
            --output empirical/floral_defence_selectivity/formal_bibliographic_frame_v2/DIRECT_ACCESS_GEOMETRY_ELIGIBILITY_DECISIONS_V4.csv \
            --receipt empirical/floral_defence_selectivity/formal_bibliographic_frame_v2/DIRECT_ACCESS_GEOMETRY_SOURCE_ELIGIBILITY_RECEIPT_V1.json

      - name: Validate no direction leak
        run: |
          python scripts/validate_direct_access_geometry_fulltext_decisions.py \
            --screen empirical/floral_defence_selectivity/formal_bibliographic_frame_v2/DIRECT_ACCESS_GEOMETRY_BIBLIOGRAPHIC_SCREEN_V1.csv \
            --decisions empirical/floral_defence_selectivity/formal_bibliographic_frame_v2/DIRECT_ACCESS_GEOMETRY_ELIGIBILITY_DECISIONS_V4.csv
          cat empirical/floral_defence_selectivity/formal_bibliographic_frame_v2/DIRECT_ACCESS_GEOMETRY_SOURCE_ELIGIBILITY_RECEIPT_V1.json

      - name: Commit source eligibility state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            empirical/floral_defence_selectivity/formal_bibliographic_frame_v2/DIRECT_ACCESS_GEOMETRY_ELIGIBILITY_DECISIONS_V4.csv \
            empirical/floral_defence_selectivity/formal_bibliographic_frame_v2/DIRECT_ACCESS_GEOMETRY_SOURCE_ELIGIBILITY_RECEIPT_V1.json
          if git diff --cached --quiet; then
            echo "No source eligibility changes."
          else
            git commit -m "Apply direction-blind source eligibility batches"
            git pull --rebase origin analysis/formal-biblio-openalex-fetch-v1
            git push origin HEAD:analysis/formal-biblio-openalex-fetch-v1
          fi
