name: Build BITA mechanism paper figures

on:
  push:
    paths:
      - 'scripts/build_mechanism_identification_figures_svg.py'
      - 'scripts/build_identification_design_figures_svg.py'
      - 'empirical/identification_design/**'
      - 'empirical/mechanism_pattern_synthesis/**'
      - 'manuscript/MANUSCRIPT_TRAIT_DIFFERENTIATION_V1.md'
      - 'manuscript/TRAIT_DIFFERENTIATION_FIGURE_CAPTIONS_V1.md'
      - 'tests/test_mechanism_identification_figures.py'
      - '.github/workflows/build-bita-mechanism-paper.yml'
  pull_request:
    paths:
      - 'scripts/build_mechanism_identification_figures_svg.py'
      - 'scripts/build_identification_design_figures_svg.py'
      - 'empirical/identification_design/**'
      - 'empirical/mechanism_pattern_synthesis/**'
      - 'manuscript/MANUSCRIPT_TRAIT_DIFFERENTIATION_V1.md'
      - 'manuscript/TRAIT_DIFFERENTIATION_FIGURE_CAPTIONS_V1.md'
      - 'tests/test_mechanism_identification_figures.py'

jobs:
  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Validate source-backed evidence counts
        run: python scripts/build_pattern_expansion_readout.py
      - name: Build active Main figures
        run: python scripts/build_mechanism_identification_figures_svg.py
      - name: Run focused figure and coverage tests
        run: python -m pytest -q tests/test_mechanism_identification_figures.py tests/test_identification_coverage.py
      - name: Confirm exactly five SVGs
        run: |
          test "$(find manuscript/mechanism_identification_figures -maxdepth 1 -name '*.svg' | wc -l)" -eq 5
          grep -q '17-system' manuscript/mechanism_identification_figures/FIGURE_4_FRAGMENTED_FRONTIER.svg
          grep -q '56 routes / 25 clusters' manuscript/mechanism_identification_figures/FIGURE_4_FRAGMENTED_FRONTIER.svg
      - uses: actions/upload-artifact@v4
        with:
          name: bita-mechanism-identification-main-figures
          path: manuscript/mechanism_identification_figures/*.svg
          if-no-files-found: error
