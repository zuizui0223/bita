name: build-main-figures-4-5

on:
  pull_request:
    paths:
      - 'scripts/build_main_figures_4_5.py'
      - 'scripts/reorganize_result_figures_once.py'
      - 'manuscript/figures/FIGURE_5_QUANTITATIVE_IDENTIFICATION_BOUNDARY.svg'
      - 'manuscript/supplementary/figures/FIGURE_S3_SAME_SYSTEM_ROUTE_MATRIX.svg'
      - '.github/workflows/build-main-figures-4-5.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild and validate result-first Main Figures 4 and 5
        run: |
          python -m pip install matplotlib
          python scripts/build_main_figures_4_5.py
          test -s manuscript/figures/FIGURE_5_QUANTITATIVE_IDENTIFICATION_BOUNDARY.svg
          test -s manuscript/supplementary/figures/FIGURE_S3_SAME_SYSTEM_ROUTE_MATRIX.svg
          grep -q 'Quantitative evidence narrows the problem' manuscript/figures/FIGURE_5_QUANTITATIVE_IDENTIFICATION_BOUNDARY.svg
          grep -q '+0.129' manuscript/figures/FIGURE_5_QUANTITATIVE_IDENTIFICATION_BOUNDARY.svg
          grep -q '35/48' manuscript/figures/FIGURE_5_QUANTITATIVE_IDENTIFICATION_BOUNDARY.svg
          grep -q '0 strict estimates' manuscript/figures/FIGURE_5_QUANTITATIVE_IDENTIFICATION_BOUNDARY.svg
          grep -q 'A → pollination' manuscript/supplementary/figures/FIGURE_S3_SAME_SYSTEM_ROUTE_MATRIX.svg
          grep -q 'Rows are independent biological clusters' manuscript/supplementary/figures/FIGURE_S3_SAME_SYSTEM_ROUTE_MATRIX.svg

  sync-hierarchy-once:
    runs-on: ubuntu-latest
    needs: build
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply result-first hierarchy
        run: python scripts/reorganize_result_figures_once.py
      - name: Commit synchronized reader-facing files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- manuscript/MANUSCRIPT_THEORETICAL_ECOLOGY.md manuscript/supplementary/SUPPLEMENTARY_MATERIAL.md manuscript/figures/README.md SUPPLEMENT_MANIFEST.md scripts/build_ecology_submission_sources.py submission/FIGURE_AND_TABLE_PLAN.md tests/test_ecology_submission_packaging.py
          git rm -f manuscript/figures/FIGURE_4_MECHANISM_PATTERN_OVERVIEW.svg
          if git diff --cached --quiet; then
            echo 'No hierarchy changes to commit.'
            exit 0
          fi
          git commit -m 'Reorganize result figures between Main and Supplement'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
