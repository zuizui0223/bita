name: build-main-figures-4-5

on:
  pull_request:
    paths:
      - 'scripts/build_main_figures_4_5.py'
      - 'manuscript/figures/FIGURE_4_MECHANISM_PATTERN_OVERVIEW.svg'
      - 'manuscript/figures/FIGURE_5_QUANTITATIVE_IDENTIFICATION_BOUNDARY.svg'
      - '.github/workflows/build-main-figures-4-5.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild and verify Figures 4 and 5 are deterministic
        run: |
          python -m pip install matplotlib
          cp manuscript/figures/FIGURE_4_MECHANISM_PATTERN_OVERVIEW.svg /tmp/FIGURE_4.svg
          cp manuscript/figures/FIGURE_5_QUANTITATIVE_IDENTIFICATION_BOUNDARY.svg /tmp/FIGURE_5.svg
          python scripts/build_main_figures_4_5.py
          test -s manuscript/figures/FIGURE_4_MECHANISM_PATTERN_OVERVIEW.svg
          test -s manuscript/figures/FIGURE_5_QUANTITATIVE_IDENTIFICATION_BOUNDARY.svg
          grep -q 'Mechanism before Pattern' manuscript/figures/FIGURE_4_MECHANISM_PATTERN_OVERVIEW.svg
          grep -q 'Quantitative evidence narrows the problem' manuscript/figures/FIGURE_5_QUANTITATIVE_IDENTIFICATION_BOUNDARY.svg
          cmp /tmp/FIGURE_4.svg manuscript/figures/FIGURE_4_MECHANISM_PATTERN_OVERVIEW.svg
          cmp /tmp/FIGURE_5.svg manuscript/figures/FIGURE_5_QUANTITATIVE_IDENTIFICATION_BOUNDARY.svg
