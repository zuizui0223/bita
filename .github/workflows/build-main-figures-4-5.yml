name: build-main-figures-4-5

on:
  pull_request:
    paths:
      - 'scripts/build_main_figures_4_5.py'
      - 'scripts/build_part_i_regime_figure_svg.py'
      - 'scripts/build_empirical_mechanism_figure_svg.py'
      - 'scripts/build_supplementary_figures_svg.py'
      - 'scripts/qa_update_figure_legibility_once.py'
      - 'manuscript/figures/FIGURE_2_THEORY_REGIME_MAP.svg'
      - 'manuscript/figures/FIGURE_3_EMPIRICAL_MECHANISM_ARCHITECTURE.svg'
      - 'manuscript/figures/FIGURE_5_QUANTITATIVE_IDENTIFICATION_BOUNDARY.svg'
      - 'manuscript/supplementary/figures/FIGURE_S3_SAME_SYSTEM_ROUTE_MATRIX.svg'
      - '.github/workflows/build-main-figures-4-5.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild and validate result-first Main Figures 4 and 5
        run: |
          python -m pip install matplotlib
          python scripts/build_main_figures_4_5.py
          test -s manuscript/figures/FIGURE_5_QUANTITATIVE_IDENTIFICATION_BOUNDARY.svg
          test -s manuscript/supplementary/figures/FIGURE_S3_SAME_SYSTEM_ROUTE_MATRIX.svg
          grep -q 'Quantitative evidence narrows the problem' manuscript/figures/FIGURE_5_QUANTITATIVE_IDENTIFICATION_BOUNDARY.svg
          grep -q '+0.129' manuscript/figures/FIGURE_5_QUANTITATIVE_IDENTIFICATION_BOUNDARY.svg
          grep -q '35/48' manuscript/figures/FIGURE_5_QUANTITATIVE_IDENTIFICATION_BOUNDARY.svg
          grep -q '0 strict estimates' manuscript/figures/FIGURE_5_QUANTITATIVE_IDENTIFICATION_BOUNDARY.svg
          grep -q 'A → pollination' manuscript/supplementary/figures/FIGURE_S3_SAME_SYSTEM_ROUTE_MATRIX.svg
          grep -q 'Rows are independent biological clusters' manuscript/supplementary/figures/FIGURE_S3_SAME_SYSTEM_ROUTE_MATRIX.svg

  synchronize-legibility-once:
    runs-on: ubuntu-latest
    needs: build
    if: github.event.pull_request.head.ref == 'qa/improve-figure-legibility-v1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Apply publication-legibility patch and regenerate canonical SVGs
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/qa_update_figure_legibility_once.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'for token in ("51.9% complementary", "48.1% complementary", "not empirical probabilities"):',
              'for token in ("Biological parameter scenarios", "Endpoint-normalized response shapes", "not empirical probabilities"):',
          )
          p.write_text(s, encoding='utf-8')
          PY
          python scripts/qa_update_figure_legibility_once.py
      - name: Validate frozen scientific content
        run: |
          python -m pytest -q \
            tests/test_build_part_i_regime_figure_svg.py \
            tests/test_committed_figure2.py \
            tests/test_build_empirical_mechanism_figure_svg.py \
            tests/test_build_supplementary_figures_svg.py
      - name: Commit regenerated publication-legibility sources
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            scripts/build_empirical_mechanism_figure_svg.py \
            scripts/build_supplementary_figures_svg.py \
            manuscript/figures/FIGURE_2_THEORY_REGIME_MAP.svg \
            manuscript/figures/FIGURE_3_EMPIRICAL_MECHANISM_ARCHITECTURE.svg \
            manuscript/supplementary/figures/FIGURE_S3_SAME_SYSTEM_ROUTE_MATRIX.svg
          if git diff --cached --quiet; then
            echo 'No regenerated figure changes to commit.'
            exit 0
          fi
          git commit -m 'Increase publication legibility of Figures 2, 3, and 5'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
