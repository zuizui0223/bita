name: build-main-figures-4-5

on:
  pull_request:
    paths:
      - 'scripts/build_main_figures_4_5.py'
      - '.github/workflows/build-main-figures-4-5.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.head_ref == 'agent/add-main-figures-4-5-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-main-figures-4-5-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate Figures 4 and 5
        run: |
          python -m pip install matplotlib
          python scripts/build_main_figures_4_5.py
          test -s manuscript/figures/FIGURE_4_MECHANISM_PATTERN_OVERVIEW.svg
          test -s manuscript/figures/FIGURE_5_QUANTITATIVE_IDENTIFICATION_BOUNDARY.svg
          grep -q 'Mechanism before Pattern' manuscript/figures/FIGURE_4_MECHANISM_PATTERN_OVERVIEW.svg
          grep -q 'Quantitative evidence narrows the problem' manuscript/figures/FIGURE_5_QUANTITATIVE_IDENTIFICATION_BOUNDARY.svg
      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manuscript/figures/FIGURE_4_MECHANISM_PATTERN_OVERVIEW.svg \
                  manuscript/figures/FIGURE_5_QUANTITATIVE_IDENTIFICATION_BOUNDARY.svg
          git diff --cached --quiet || git commit -m "Generate main Figures 4 and 5"
          git push origin HEAD:agent/add-main-figures-4-5-v1
