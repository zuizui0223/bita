name: build-main-figures-4-5

on:
  pull_request:
    paths:
      - 'scripts/build_main_figures_4_5.py'
      - 'scripts/build_empirical_mechanism_figure_svg.py'
      - 'scripts/qa_fix_fig3_context_line_once.py'
      - 'manuscript/figures/FIGURE_3_EMPIRICAL_MECHANISM_ARCHITECTURE.svg'
      - 'manuscript/figures/FIGURE_5_QUANTITATIVE_IDENTIFICATION_BOUNDARY.svg'
      - 'manuscript/supplementary/figures/FIGURE_S3_SAME_SYSTEM_ROUTE_MATRIX.svg'
      - '.github/workflows/build-main-figures-4-5.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild and validate result-first Main Figures 4 and 5
        run: |
          python -m pip install matplotlib
          python scripts/build_main_figures_4_5.py
          test -s manuscript/figures/FIGURE_5_QUANTITATIVE_IDENTIFICATION_BOUNDARY.svg
          test -s manuscript/supplementary/figures/FIGURE_S3_SAME_SYSTEM_ROUTE_MATRIX.svg
          grep -q 'Quantitative evidence narrows the problem' manuscript/figures/FIGURE_5_QUANTITATIVE_IDENTIFICATION_BOUNDARY.svg
          grep -q '+0.129' manuscript/figures/FIGURE_5_QUANTITATIVE_IDENTIFICATION_BOUNDARY.svg
          grep -q '35/48' manuscript/figures/FIGURE_5_QUANTITATIVE_IDENTIFICATION_BOUNDARY.svg
          grep -q '0 strict estimates' manuscript/figures/FIGURE_5_QUANTITATIVE_IDENTIFICATION_BOUNDARY.svg
          grep -q 'A → pollination' manuscript/supplementary/figures/FIGURE_S3_SAME_SYSTEM_ROUTE_MATRIX.svg
          grep -q 'Rows are independent biological clusters' manuscript/supplementary/figures/FIGURE_S3_SAME_SYSTEM_ROUTE_MATRIX.svg

  synchronize-fig3-fit-once:
    runs-on: ubuntu-latest
    needs: build
    if: github.event.pull_request.head.ref == 'qa/improve-figure-legibility-v1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply Figure 3 context-line fit fix
        run: python scripts/qa_fix_fig3_context_line_once.py
      - name: Validate Figure 3 frozen content
        run: python -m pytest -q tests/test_build_empirical_mechanism_figure_svg.py
      - name: Commit final Figure 3 fit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- scripts/build_empirical_mechanism_figure_svg.py manuscript/figures/FIGURE_3_EMPIRICAL_MECHANISM_ARCHITECTURE.svg
          if git diff --cached --quiet; then
            echo 'No Figure 3 fit change to commit.'
            exit 0
          fi
          git commit -m 'Fit Figure 3 contextual synthesis label'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
