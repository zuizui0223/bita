name: Freeze formal OpenAlex frame with provider audit

on:
  push:
    branches:
      - analysis/formal-biblio-openalex-fetch-v1
    paths:
      - .github/workflows/freeze-direct-access-geometry-openalex-frame.yml

permissions:
  contents: write

jobs:
  validate-and-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run focused regression tests
        run: |
          python -m pip install -q pytest
          pytest -q \
            tests/test_direct_access_geometry_bibliographic_screen_bootstrap.py \
            tests/test_direct_access_geometry_bibliographic_zip_intake.py \
            tests/test_direct_access_geometry_fulltext_decisions.py \
            tests/test_direct_access_geometry_formal_recurrence_summary.py

      - name: Fetch complete amended OpenAlex Q1-Q8 exports
        run: |
          rm -rf artifacts/openalex_q1_q8_final
          python scripts/fetch_direct_access_geometry_openalex_frame.py \
            --output-dir artifacts/openalex_q1_q8_final \
            --search-date 2026-09-25

      - name: Build exact nine-file intake packet
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          src = Path("artifacts/openalex_q1_q8_final")
          out = Path("artifacts/DIRECT_ACCESS_GEOMETRY_OPENALEX_Q1_Q8_FINAL.zip")
          names = [f"Q{i}.json" for i in range(1, 9)] + ["QUERY_COUNTS.csv"]
          with zipfile.ZipFile(out, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for name in names:
                  zf.write(src / name, arcname=name)
          PY

      - name: Freeze provider-accounted formal frame
        run: |
          rm -rf empirical/floral_defence_selectivity/formal_bibliographic_frame_v2
          python scripts/ingest_direct_access_geometry_bibliographic_export_zip.py \
            --zip artifacts/DIRECT_ACCESS_GEOMETRY_OPENALEX_Q1_Q8_FINAL.zip \
            --output-dir empirical/floral_defence_selectivity/formal_bibliographic_frame_v2 \
            --search-date 2026-09-25 \
            --source-db OpenAlex \
            --provider-coverage-exceptions empirical/floral_defence_selectivity/DIRECT_ACCESS_GEOMETRY_PROVIDER_COVERAGE_EXCEPTIONS_V1.csv
          cp artifacts/openalex_q1_q8_final/QUERY_COUNTS.csv \
            empirical/floral_defence_selectivity/formal_bibliographic_frame_v2/QUERY_COUNTS.csv
          cp artifacts/openalex_q1_q8_final/OPENALEX_FETCH_RECEIPT_V1.json \
            empirical/floral_defence_selectivity/formal_bibliographic_frame_v2/OPENALEX_FETCH_RECEIPT_V1.json

      - name: Require fully accounted known-corpus recall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("empirical/floral_defence_selectivity/formal_bibliographic_frame_v2/DIRECT_ACCESS_GEOMETRY_BIBLIOGRAPHIC_SCREEN_BOOTSTRAP_RECEIPT_V1.json")
          r=json.loads(p.read_text())
          assert r["known_direct_corpus_programs"] == 24
          assert r["known_programs_matched"] == 23
          assert r["known_programs_provider_absent"] == ["Urcelay_Morales_Chalcoff_2006"]
          assert r["known_programs_unresolved"] == []
          assert r["provider_coverage_exceptions_applied"] is True
          assert r["provider_coverage_exception_sha256"]
          assert r["unknown_record_direction_coded"] is False
          assert r["status"] == "FRAME_SCREEN_BOOTSTRAPPED_KNOWN_CORPUS_RECALL_ACCOUNTED_PROVIDER_ABSENCE"
          print(json.dumps({
            "frame_records": r["frame_records"],
            "known_programs_matched": r["known_programs_matched"],
            "provider_absent": r["known_programs_provider_absent"],
            "unresolved": r["known_programs_unresolved"],
            "pending_fulltext_records": r["pending_fulltext_records"],
          }, indent=2))
          PY

      - name: Validate pending decision ledger
        run: |
          python scripts/validate_direct_access_geometry_fulltext_decisions.py \
            --screen empirical/floral_defence_selectivity/formal_bibliographic_frame_v2/DIRECT_ACCESS_GEOMETRY_BIBLIOGRAPHIC_SCREEN_V1.csv \
            --decisions empirical/floral_defence_selectivity/formal_bibliographic_frame_v2/DIRECT_ACCESS_GEOMETRY_FULLTEXT_DECISIONS_V1.csv

      - name: Commit frozen provider-accounted frame
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add empirical/floral_defence_selectivity/formal_bibliographic_frame_v2
          if git diff --cached --quiet; then
            echo "No frame changes to commit."
          else
            git commit -m "Freeze provider-accounted formal OpenAlex bibliographic frame"
            git push origin HEAD:analysis/formal-biblio-openalex-fetch-v1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-access-geometry-openalex-formal-frame
          path: |
            artifacts/openalex_q1_q8_final/OPENALEX_FETCH_RECEIPT_V1.json
            artifacts/openalex_q1_q8_final/QUERY_COUNTS.csv
            artifacts/DIRECT_ACCESS_GEOMETRY_OPENALEX_Q1_Q8_FINAL.zip
          if-no-files-found: warn
