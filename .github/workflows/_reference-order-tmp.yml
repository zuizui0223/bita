name: One-time Johnson reference ordering fix

on:
  push:
    branches:
      - agent/background-impossibility-gap-v2

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/_reference_order_tmp.py
      - name: Commit ordered reference and remove temporary machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Keep background reference spine alphabetized'
          git push origin HEAD:${GITHUB_REF_NAME}
