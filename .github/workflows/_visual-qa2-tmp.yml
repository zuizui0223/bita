name: One-time corrected visual QA previews

on:
  push:
    branches:
      - agent/manuscript-reader-qa-v1

permissions:
  contents: write

jobs:
  preview:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Install Inkscape
        run: |
          if ! command -v inkscape >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y inkscape
          fi
      - name: Render corrected previews
        run: |
          mkdir -p artifacts/visual_qa2/prepared
          python scripts/prepare_submission_svg.py manuscript/figures/FIGURE_2_THEORY_REGIME_MAP.svg artifacts/visual_qa2/prepared/Fig2.svg
          inkscape artifacts/visual_qa2/prepared/Fig2.svg --export-filename=artifacts/visual_qa2/Fig2.png --export-width=2200
          for n in 1 2 4; do
            case "$n" in
              1) src="manuscript/supplementary/figures/FIGURE_S1_DERIVATIVE_AGREEMENT.svg" ;;
              2) src="manuscript/supplementary/figures/FIGURE_S2_SCENARIO_SIGN_MAPS.svg" ;;
              4) src="manuscript/supplementary/figures/FIGURE_S4_QUANTITATIVE_ROBUSTNESS.svg" ;;
            esac
            inkscape "$src" --export-filename="artifacts/visual_qa2/FigS${n}.png" --export-width=2200
          done
          rm -rf artifacts/visual_qa2/prepared
      - uses: actions/upload-artifact@v4
        with:
          name: corrected-manuscript-visual-qa
          path: artifacts/visual_qa2/*.png
          if-no-files-found: error
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/_visual-qa2-tmp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove second visual QA workflow'
          git push origin HEAD:${GITHUB_REF_NAME}
