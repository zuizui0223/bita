name: promote-identification-frontier-v2

on:
  push:
    branches:
      - analysis/identification-frontier-promotion-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/identification-frontier-promotion-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply fail-closed V2 promotion when needed
        run: |
          set -euo pipefail
          if grep -q 'none of 16 screened high-information systems' manuscript/MANUSCRIPT_IDENTIFICATION_DESIGN.md; then
            python scripts/promote_identification_frontier_v2.py
          else
            grep -q 'none of 17 screened high-information systems' manuscript/MANUSCRIPT_IDENTIFICATION_DESIGN.md
            grep -q 'Seventeen high-information systems were retained' manuscript/MANUSCRIPT_IDENTIFICATION_DESIGN.md
            grep -q 'Theis and Adler (2012)' manuscript/MANUSCRIPT_IDENTIFICATION_DESIGN.md
            echo 'V2 promotion already applied; validating current state.'
          fi

      - name: Normalize target-package promotion assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_theoretical_ecology_submission_package.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '    assert "17 screened high-information systems" in text\n',
              '    assert "Seventeen high-information systems were retained" in text\n',
          )
          p.write_text(text, encoding='utf-8')
          PY

      - name: Validate promoted source contracts
        run: |
          python -m pip install pytest
          python -m pytest -q \
            tests/test_identification_coverage.py \
            tests/test_identification_frontier_augmentation.py \
            tests/test_hypercube_face_coverage.py \
            tests/test_identification_design_figures.py \
            tests/test_identification_manuscript_draft.py \
            tests/test_partial_identification_manuscript_integration.py \
            tests/test_theoretical_ecology_submission_package.py

      - name: Commit promoted sources once
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Promotion already applied; no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manuscript scripts tests
          git commit -m "Promote 17-system frontier into canonical manuscript"
          git push origin HEAD:analysis/identification-frontier-promotion-v1
