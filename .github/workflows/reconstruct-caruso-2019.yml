name: Reconstruct Caruso 2019 Dryad

on:
  push:
    branches:
      - analysis/pattern-expansion-v1
    paths:
      - "scripts/reconstruct_caruso_2019_dryad.py"
      - ".github/workflows/reconstruct-caruso-2019.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/pattern-expansion-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install workbook readers
        run: python -m pip install pandas openpyxl xlrd
      - name: Retrieve and inspect Dryad workbooks
        run: python scripts/reconstruct_caruso_2019_dryad.py
      - name: Commit reproducibility receipt
        run: |
          if git diff --quiet -- empirical/mechanism_pattern_synthesis/CARUSO_2019_DRYAD_RECEIPT_V1.json; then
            echo "Caruso Dryad receipt already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add empirical/mechanism_pattern_synthesis/CARUSO_2019_DRYAD_RECEIPT_V1.json
          git commit -m "Record Caruso 2019 Dryad reconstruction receipt"
          git fetch origin analysis/pattern-expansion-v1
          git rebase origin/analysis/pattern-expansion-v1
          git push origin HEAD:analysis/pattern-expansion-v1
