name: Validate participation-route freeze lifecycle

on:
  pull_request:
    paths:
      - "empirical/floral_defence_selectivity/PARTICIPATION_ROUTE_DECOMPOSITION_PREREG_V1.md"
      - "empirical/floral_defence_selectivity/PARTICIPATION_ROUTE_DENOMINATOR_FREEZE_V1.json"
      - "scripts/analyze_aubert2026_participation_route_decomposition.py"
      - "tests/test_aubert2026_participation_route_decomposition.py"
      - ".github/workflows/validate-participation-route-freeze.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and tests
        run: python -m pip install -e '.[dev]'

      - name: Run synthetic model and jackknife acceptance tests
        run: pytest -q tests/test_aubert2026_participation_route_decomposition.py

      - name: Verify frozen lifecycle state
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          base = Path("empirical/floral_defence_selectivity")
          freeze_path = base / "PARTICIPATION_ROUTE_DENOMINATOR_FREEZE_V1.json"
          result_path = base / "results" / "aubert2026_participation_route_decomposition_first_open.json"
          receipt_path = base / "results" / "AUBERT2026_PARTICIPATION_FIRST_OPEN_RECEIPT_V1.json"

          freeze = json.loads(freeze_path.read_text())

          script = Path("scripts/analyze_aubert2026_participation_route_decomposition.py").read_text()
          assert "EQ_LOW = 0.80" in script
          assert "EQ_HIGH = 1.25" in script
          assert "delete-one-plant-species jackknife" in script

          opened = freeze["participation_effect_opened"]
          if opened is False:
              assert freeze["status"] == "FROZEN_BEFORE_MISMATCH_PARTICIPATION_EFFECT"
              assert not result_path.exists()
              assert not receipt_path.exists()
              print("pre-effect freeze verified")
          else:
              assert opened is True
              assert result_path.is_file()
              assert receipt_path.is_file()

              result = json.loads(result_path.read_text())
              receipt = json.loads(receipt_path.read_text())

              digest = hashlib.sha256(result_path.read_bytes()).hexdigest()
              assert digest == receipt["result_sha256"]
              assert digest == freeze["first_open"]["result_sha256"]
              assert receipt["status"] == "FIRST_REAL_EFFECT_OPENED_RETAIN_REGARDLESS_OF_SIGN"
              assert result["decision"]["classification"] == freeze["first_open"]["classification"]
              assert result["decision"]["rate_ratio"] == freeze["first_open"]["rate_ratio"]
              print("post-open frozen result verified")
          PY
