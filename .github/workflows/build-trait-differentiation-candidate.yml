name: legacy-trait-differentiation-candidate-guard

on:
  pull_request:
    paths:
      - 'manuscript/MANUSCRIPT_TRAIT_DIFFERENTIATION_V1.md'
      - 'docs/SUBMISSION_SCOPE.md'
      - 'docs/CHAPTER2_SUBMISSION_SCOPE_V1.md'
      - 'scripts/build_bita_mechanism_candidate_sources.py'
      - 'tests/test_trait_differentiation*.py'
      - '.github/workflows/build-trait-differentiation-candidate.yml'
      - '.github/workflows/build-bita-mechanism-review-package.yml'
  workflow_dispatch:

jobs:
  legacy-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirm old Chapter 2 package is retired
        run: |
          grep -q 'ACTIVE_PACKAGE_STATUS = REBUILT_AND_VALIDATED' docs/SUBMISSION_SCOPE.md
          grep -q 'ACTIVE_ARTIFACT = bita-mechanism-identification-review-package' docs/SUBMISSION_SCOPE.md
          grep -q 'legacy provenance only' docs/SUBMISSION_SCOPE.md
          grep -q 'Trait interaction is not ecological mechanism' manuscript/MANUSCRIPT_TRAIT_DIFFERENTIATION_V1.md

      - name: Confirm active mechanism package route exists
        run: |
          test -f scripts/build_bita_mechanism_candidate_sources.py
          test -f .github/workflows/build-bita-mechanism-review-package.yml
          grep -q 'build_bita_mechanism_candidate_sources.py' .github/workflows/build-bita-mechanism-review-package.yml

      - name: Reject stale architecture-package rebuild
        run: |
          ! grep -q 'build_trait_differentiation_candidate_package_sources.py' docs/SUBMISSION_SCOPE.md
          echo 'Legacy trait-differentiation package is retired; active mechanism-identification package owns review builds.'
