name: legacy-trait-differentiation-candidate-guard

on:
  pull_request:
    paths:
      - 'manuscript/MANUSCRIPT_TRAIT_DIFFERENTIATION_V1.md'
      - 'docs/SUBMISSION_SCOPE.md'
      - 'docs/CHAPTER2_SUBMISSION_SCOPE_V1.md'
      - 'scripts/build_bita_mechanism_candidate_sources.py'
      - 'tests/test_trait_differentiation*.py'
      - '.github/workflows/build-trait-differentiation-candidate.yml'
      - '.github/workflows/build-bita-mechanism-review-package.yml'
  workflow_dispatch:

jobs:
  legacy-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirm Letter promotion and preserved legacy manuscripts
        run: |
          grep -q 'PRIMARY_FORWARD_PAPER = ACCESS_ROUTING_LETTER' docs/SUBMISSION_SCOPE.md
          grep -q 'trait interaction != ecological mechanism' docs/SUBMISSION_SCOPE.md
          test -f manuscript/MANUSCRIPT_ACCESS_ROUTING_LETTER_V0.md
          test -f manuscript/MANUSCRIPT_FLORAL_DEFENCE_SELECTIVITY_V0.md
          test -f manuscript/MANUSCRIPT_TRAIT_DIFFERENTIATION_V1.md

      - name: Confirm legacy mechanism package route still exists
        run: |
          test -f scripts/build_bita_mechanism_candidate_sources.py
          test -f .github/workflows/build-bita-mechanism-review-package.yml
          grep -q 'build_bita_mechanism_candidate_sources.py' .github/workflows/build-bita-mechanism-review-package.yml

      - name: Reject stale architecture-package promotion
        run: |
          ! grep -q 'build_trait_differentiation_candidate_package_sources.py' docs/SUBMISSION_SCOPE.md
          echo 'Macro floral-defence selectivity is active; legacy mechanism package is preserved, not canonical.'
