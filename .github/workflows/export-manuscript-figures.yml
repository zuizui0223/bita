name: Export manuscript figures

on:
  pull_request:
    paths:
      - "manuscript/identification_figures/**"
      - "scripts/export_manuscript_figures.sh"
      - "scripts/prepare_submission_svg.py"
      - ".github/workflows/export-manuscript-figures.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Inkscape when absent
        run: |
          if ! command -v inkscape >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y inkscape
          fi
          inkscape --version
      - name: Export and validate identification-design EPS figures
        run: |
          bash scripts/export_manuscript_figures.sh artifacts/manuscript_figures
          for n in 1 2 3 4 5; do
            test -s "artifacts/manuscript_figures/Fig${n}.eps"
            grep -aq '^%!PS-Adobe' "artifacts/manuscript_figures/Fig${n}.eps"
            grep -aq '%%BoundingBox:' "artifacts/manuscript_figures/Fig${n}.eps"
          done
          grep -q 'Canonical identification-design Main hierarchy' artifacts/manuscript_figures/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: manuscript-figures-eps
          path: artifacts/manuscript_figures/
          if-no-files-found: error
