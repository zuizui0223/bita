name: Reserve access-routing Zenodo DOI

on:
  push:
    branches:
      - main
    paths:
      - "scripts/reserve_access_routing_zenodo_doi.py"
      - "tests/test_reserve_access_routing_zenodo_doi.py"
      - ".github/workflows/reserve-access-routing-zenodo-doi.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reserve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test reservation logic
        run: |
          python -m pip install pytest
          pytest -q tests/test_reserve_access_routing_zenodo_doi.py tests/test_reserved_archive_doi.py

      - name: Require secure Zenodo credential
        run: |
          if [ -z "$ZENODO_ACCESS_TOKEN" ]; then
            echo "::error::ZENODO_ACCESS_TOKEN repository secret is missing."
            echo "::error::Create a Zenodo personal access token with deposit:write scope and save it as the GitHub Actions secret ZENODO_ACCESS_TOKEN."
            exit 1
          fi

      - name: Create Zenodo draft and reserve DOI
        run: python scripts/reserve_access_routing_zenodo_doi.py

      - name: Verify DOI-bearing submission state
        run: python scripts/apply_reserved_archive_doi.py --check-only

      - name: Commit reserved DOI to main
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No DOI changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             manuscript/MANUSCRIPT_ACCESS_ROUTING_LETTER_V0.md             submission/ECOLOGY_LETTERS_LETTER_TITLE_PAGE_V1.md             submission/ECOLOGY_LETTERS_LETTER_COVER_V0.md             docs/PUBLICATION_STATUS.md             docs/SUBMISSION_SCOPE.md             submission/access_routing_archive/README.md             submission/access_routing_archive/ZENODO_METADATA_TEMPLATE.md             submission/access_routing_archive/RESERVED_DOI_RECEIPT.json             submission/access_routing_archive/ZENODO_DRAFT_RECEIPT.json
          git commit -m "Reserve Zenodo DOI for access-routing Letter"
          git pull --rebase origin main
          git push origin HEAD:main
