name: Reserve access-routing Zenodo DOI

on:
  push:
    branches:
      - main
    paths:
      - "scripts/reserve_access_routing_zenodo_doi.py"
      - "tests/test_reserve_access_routing_zenodo_doi.py"
      - ".github/workflows/reserve-access-routing-zenodo-doi.yml"
  workflow_dispatch:

# Safe credential re-probe: no publish step; contents stay read-only.
permissions:
  contents: read

jobs:
  reserve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test reservation logic
        run: |
          python -m pip install pytest
          pytest -q tests/test_reserve_access_routing_zenodo_doi.py tests/test_reserved_archive_doi.py

      - name: Require secure Zenodo credential
        run: |
          if [ -z "$ZENODO_ACCESS_TOKEN" ]; then
            echo "::error::ZENODO_ACCESS_TOKEN repository secret is missing."
            echo "::error::Create a Zenodo personal access token with deposit:write scope and save it as the GitHub Actions secret ZENODO_ACCESS_TOKEN."
            exit 1
          fi

      - name: Create Zenodo draft and reserve DOI
        run: python scripts/reserve_access_routing_zenodo_doi.py

      - name: Verify DOI-bearing submission state
        run: python scripts/apply_reserved_archive_doi.py --check-only

      - name: Package DOI-bearing changes for handoff
        run: |
          git diff -- \
            manuscript/MANUSCRIPT_ACCESS_ROUTING_LETTER_V0.md \
            submission/ECOLOGY_LETTERS_LETTER_TITLE_PAGE_V1.md \
            submission/ECOLOGY_LETTERS_LETTER_COVER_V0.md \
            docs/PUBLICATION_STATUS.md \
            docs/SUBMISSION_SCOPE.md \
            submission/access_routing_archive/README.md \
            submission/access_routing_archive/ZENODO_METADATA_TEMPLATE.md \
            > zenodo-doi-reservation.patch
          cp submission/access_routing_archive/RESERVED_DOI_RECEIPT.json .
          cp submission/access_routing_archive/ZENODO_DRAFT_RECEIPT.json .

      - uses: actions/upload-artifact@v4
        with:
          name: zenodo-doi-reservation
          path: |
            zenodo-doi-reservation.patch
            RESERVED_DOI_RECEIPT.json
            ZENODO_DRAFT_RECEIPT.json
          if-no-files-found: error
