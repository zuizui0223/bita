name: Test OpenAlex batched work fetch

on:
  push:
    branches:
      - analysis/formal-biblio-openalex-fetch-v1
    paths:
      - .github/workflows/test-openalex-batch-fetch.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          ids="W2609261019|W7201920517"
          params={"filter":f"openalex_id:{ids}","per-page":"100","select":"id,title,abstract_inverted_index"}
          url="https://api.openalex.org/works?"+urllib.parse.urlencode(params)
          req=urllib.request.Request(url,headers={"User-Agent":"bita-batch-test/1.0","Accept":"application/json"})
          try:
              with urllib.request.urlopen(req,timeout=60) as r:
                  p=json.loads(r.read().decode())
              print(json.dumps({"url":url,"count":p.get("meta",{}).get("count"),"ids":[x.get("id") for x in p.get("results",[])]},indent=2))
          except Exception as e:
              print(repr(e))
              raise
          PY
