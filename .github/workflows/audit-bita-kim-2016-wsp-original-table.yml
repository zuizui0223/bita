name: audit-bita-kim-2016-wsp-original-table
on:
  push:
    branches: ['analysis/bita-kim-forward-wsp-genotypes-20261116']
    paths: ['.github/workflows/audit-bita-kim-2016-wsp-original-table.yml']
  pull_request:
    branches: ['analysis/bita-forward-dol-source-20261116']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-supplement-table:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-text PDF reader only
        run: python -m pip install 'pymupdf>=1.24,<2'
      - name: Retrieve original Nature/PMC Kim Supplementary Information by official URLs
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,urllib.request,urllib.error
          from pathlib import Path
          import fitz
          out=Path('source_audit');out.mkdir(exist_ok=True)
          targets=[
            'https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fncomms10508/MediaObjects/41467_2016_BFncomms10508_MOESM747_ESM.pdf',
            'https://static-content.springer.com/esm/art%3A10.1038%2Fncomms10508/MediaObjects/41467_2016_BFncomms10508_MOESM747_ESM.pdf',
            'https://pmc.ncbi.nlm.nih.gov/articles/instance/4748119/bin/ncomms10508-s1.pdf'
          ]
          report={'doi':'10.1038/ncomms10508','targets':[]}
          for url in targets:
              try:
                  req=urllib.request.Request(url,headers={
                       'User-Agent':'Mozilla/5.0 (public scientific source provenance)',
                       'Accept':'application/pdf'})
                  with urllib.request.urlopen(req,timeout=22) as resp:
                      raw=resp.read(2800000)
                      t=resp.headers.get('content-type')
                  rec={'url':url,'status':resp.status,'bytes':len(raw),
                       'sha256':hashlib.sha256(raw).hexdigest(),'mime':t,
                       'starts_pdf':raw.startswith(b'%PDF')}
                  if raw.startswith(b'%PDF') and len(raw)>200000:
                      pdf=out/'Kim2016_original_supplement.pdf'
                      pdf.write_bytes(raw)
                      with fitz.open(stream=raw,filetype='pdf') as doc:
                          parts=[]
                          pages=[]
                          for i,page in enumerate(doc):
                              text=' '.join(page.get_text('text').split())
                              found=('Supplementary Table 2' in text or
                                     'Table 2' in text or 'wspE' in text or
                                     'Dry mutant' in text or 'Dry morphotype' in text)
                              pages.append({'page':i+1,'chars':len(text),'relevant':found})
                              if found:
                                  parts.append({'page':i+1,'text':page.get_text('text')[:27000]})
                      report['selected_url']=url
                      report['sha256']=rec['sha256']
                      report['bytes']=len(raw)
                      report['pages']=pages
                      report['relevant_text']=parts
                      (out/'original_supplement_extraction.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
                      print('BITA_KIM_WSP_SOURCE:'+json.dumps(report,ensure_ascii=False,separators=(',',':')),flush=True)
                      report['targets'].append(rec)
                      break
                  else:
                      rec['note']='not an original PDF'
                  report['targets'].append(rec)
              except urllib.error.HTTPError as ex:
                  report['targets'].append({'url':url,'status':ex.code,'reason':str(ex.reason)})
              except Exception as ex:
                  report['targets'].append({'url':url,'status':'ERROR','reason':type(ex).__name__+': '+str(ex)[:160]})
          if 'sha256' not in report:
              (out/'source_access_status.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
              print('BITA_KIM_WSP_SOURCE_UNAVAILABLE:'+json.dumps(report,ensure_ascii=False),flush=True)
              raise RuntimeError('No valid original source supplementary PDF')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bita-kim2016-original-wsp-source
          path: source_audit/
          if-no-files-found: error
          retention-days: 30
