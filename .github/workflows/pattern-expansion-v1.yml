name: Validate Pattern expansion v1

on:
  push:
    branches:
      - analysis/pattern-expansion-v1
    paths:
      - "empirical/mechanism_pattern_synthesis/EXPANSION_*"
      - "empirical/mechanism_pattern_synthesis/PATTERN_*"
      - "empirical/mechanism_pattern_synthesis/CROSS_MODULE_PATTERN_MATRIX_V2.csv"
      - "scripts/build_pattern_expansion_readout.py"
      - "tests/test_pattern_expansion_v1.py"
      - ".github/workflows/pattern-expansion-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/pattern-expansion-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Validate expansion contract
        run: pytest -q tests/test_pattern_expansion_v1.py
      - name: Build provisional readout
        run: python scripts/build_pattern_expansion_readout.py
      - name: Commit generated readout when changed
        run: |
          if git diff --quiet -- empirical/mechanism_pattern_synthesis/PATTERN_EXPANSION_READOUT_V1.json empirical/mechanism_pattern_synthesis/PATTERN_EXPANSION_READOUT_V1.md; then
            echo "Expansion readout already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add empirical/mechanism_pattern_synthesis/PATTERN_EXPANSION_READOUT_V1.json empirical/mechanism_pattern_synthesis/PATTERN_EXPANSION_READOUT_V1.md
          git commit -m "Generate provisional Pattern expansion readout"
          git fetch origin analysis/pattern-expansion-v1
          git rebase origin/analysis/pattern-expansion-v1
          git push origin HEAD:analysis/pattern-expansion-v1
