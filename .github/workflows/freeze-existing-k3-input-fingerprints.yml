name: Freeze canonical existing k3 input fingerprints

on:
  pull_request:
    paths:
      - "scripts/fingerprint_existing_k3_inputs.py"
      - "scripts/analyze_joint_access_routing.py"
      - "scripts/analyze_sakhalkar2023_network.py"
      - "scripts/analyze_aubert2026_zenodo_extension.py"
      - ".github/workflows/freeze-existing-k3-input-fingerprints.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e '.[dev]'

      - name: Compute canonical fingerprints from frozen public sources
        run: |
          mkdir -p artifacts
          python scripts/fingerprint_existing_k3_inputs.py \
            --output artifacts/existing_k3_input_fingerprints.json \
            | tee artifacts/existing_k3_input_fingerprints.log

      - name: Validate receipt shape
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("artifacts/existing_k3_input_fingerprints.json")
          receipt = json.loads(p.read_text())
          assert receipt["receipt"] == "BITA_EXISTING_K3_INPUT_FINGERPRINTS_V1"
          frozen = json.loads(
              Path(
                  "empirical/floral_defence_selectivity/"
                  "EXISTING_K3_INPUT_FINGERPRINTS_V1.json"
              ).read_text()
          )
          for key in ("sakhalkar", "aubert_ephi"):
              entry = receipt["networks"][key]
              expected = frozen["networks"][key]
              assert entry["analysis_units"] == expected["analysis_units"]
              assert (
                  entry["canonical_stable_json_sha256"]
                  == expected["canonical_stable_json_sha256"]
              )
              assert entry["source_doi"] == expected["source_doi"]
          assert receipt["source_file_integrity"] == frozen["source_file_integrity"]
          print(json.dumps(receipt, indent=2, sort_keys=True))
          print("Canonical existing-network fingerprints match frozen receipt")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: existing-k3-input-fingerprints
          path: artifacts/existing_k3_input_fingerprints.json
          if-no-files-found: error
