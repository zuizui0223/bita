name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  apply-ecological-polish:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/ecological-interpretation-polish-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ecological-interpretation-polish-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Repair temporary patcher literals and regression wording
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('scripts/_apply_ecological_interpretation_polish_tmp.py')
          s = p.read_text(encoding='utf-8')
          marker = '# Bibliography insertions'
          prefix, suffix = s.split(marker, 1)
          prefix = re.sub(r'(?<!\\)\\(times|rho|iota|kappa|ge)', r'\\\\\1', prefix)
          prefix = re.sub(r'(?<!\\)\\([()])', r'\\\\\1', prefix)
          s = prefix + marker + suffix
          s = s.replace(
              'attraction-defence balance, non-additivity, trade-offs, ecological costs, and context-dependent evolutionary outcomes are not new ideas',
              'attraction-defence balance, non-additivity, trade-offs, and context-dependent evolutionary outcomes are not new ideas',
          )
          s = s.replace(
              'assert "not a reopening of broad Pattern evidence discovery" in audit',
              'assert "reopening of broad Pattern evidence discovery" in audit',
          )
          p.write_text(s, encoding='utf-8')
          PY
      - name: Apply bounded ecological interpretation and literature polish
        run: python scripts/_apply_ecological_interpretation_polish_tmp.py
      - name: Synchronize Ecology portal abstract and reference audit
        run: |
          python - <<'PY'
          from pathlib import Path
          man_path = Path('manuscript/MANUSCRIPT_THEORETICAL_ECOLOGY.md')
          portal_path = Path('submission/AUTHOR_AND_PORTAL_METADATA_TEMPLATE.md')
          audit_path = Path('submission/REFERENCE_AUDIT_V1.md')
          man = man_path.read_text(encoding='utf-8')
          abstract = man.split('## Abstract\n\n', 1)[1].split('\n\n**Keywords:**', 1)[0].strip()
          portal = portal_path.read_text(encoding='utf-8')
          before, rest = portal.split('### Abstract\n\n', 1)
          _, after = rest.split('\n\n### Keywords', 1)
          portal_path.write_text(before + '### Abstract\n\n' + abstract + '\n\n### Keywords' + after, encoding='utf-8')

          audit = audit_path.read_text(encoding='utf-8')
          audit = audit.replace('contains **21 bibliography entries**', 'contains **29 bibliography entries**')
          audit = audit.replace('exactly **21** bibliography entries', 'exactly **29** bibliography entries')
          marker = '## Known corrections preserved\n'
          block = '''## 2026-08-21 positioning-reference expansion\n\nEight close conceptual/context references were added to support Background and Discussion positioning rather than to enlarge the empirical Pattern ledger: Adler (2008), Catford et al. (2022), Johnson et al. (2015), Kessler & Halitschke (2009), Lucas-Barbosa (2016), Rusman et al. (2018), Sletvold (2019), and Strauss & Whittall (2006). These references establish that attraction–defence conflict, allocation/pleiotropy hypotheses, multi-agent selection, and context dependence are prior art. Their manuscript role is to sharpen the narrower contribution: an elementary one-sided exclusion plus a mechanism-first evidence architecture.\n\n'''
          if '## 2026-08-21 positioning-reference expansion' not in audit:
              audit = audit.replace(marker, block + marker, 1)
          audit_path.write_text(audit, encoding='utf-8')
          PY
      - name: Restore canonical CI and remove temporary script
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          git rm -f scripts/_apply_ecological_interpretation_polish_tmp.py
      - name: Run focused regressions
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pytest -q \
            tests/test_claim_freeze.py \
            tests/test_introduction_impossibility_gap.py \
            tests/test_manuscript_references.py \
            tests/test_ecological_interpretation_and_simplicity.py \
            tests/test_ecology_concepts_synthesis_fit.py
      - name: Commit bounded manuscript polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- manuscript/MANUSCRIPT_THEORETICAL_ECOLOGY.md \
            tests/test_manuscript_references.py \
            tests/test_ecological_interpretation_and_simplicity.py \
            docs/BACKGROUND_NOVELTY_GAP_REVIEW.md \
            submission/ECOLOGY_CONCEPTS_SYNTHESIS_FIT_AUDIT.md \
            submission/AUTHOR_AND_PORTAL_METADATA_TEMPLATE.md \
            submission/REFERENCE_AUDIT_V1.md \
            .github/workflows/ci.yml
          git commit -m "Polish ecological interpretation and prior-art positioning"
          git push origin HEAD:agent/ecological-interpretation-polish-v1

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q --junitxml=pytest-${{ matrix.python-version }}.xml
      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: pytest-${{ matrix.python-version }}.xml
          if-no-files-found: warn
