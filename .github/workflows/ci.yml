name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  apply-ecology-upgrade:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/ecology-concepts-synthesis-upgrade-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ecology-concepts-synthesis-upgrade-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply bounded Ecology Concepts & Synthesis upgrade
        run: |
          python scripts/_apply_ecology_cs_upgrade_tmp.py
          python scripts/_fix_ecology_ref_parser_tmp.py
      - name: Restore canonical CI workflow
        run: git checkout origin/main -- .github/workflows/ci.yml
      - name: Run focused regressions
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pytest -q \
            tests/test_claim_freeze.py \
            tests/test_theoretical_ecology_house_style.py \
            tests/test_ecology_concepts_synthesis_fit.py \
            tests/test_introduction_impossibility_gap.py \
            tests/test_manuscript_references.py
      - name: Commit bounded upgrade and remove temporary machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- manuscript/MANUSCRIPT_THEORETICAL_ECOLOGY.md \
            submission/AUTHOR_AND_PORTAL_METADATA_TEMPLATE.md \
            submission/TARGET_JOURNAL_STRATEGY.md \
            submission/SUBMISSION_CHECKLIST.md \
            submission/COVER_LETTER_ECOLOGY_CONCEPTS_SYNTHESIS.md \
            submission/ECOLOGY_CONCEPTS_SYNTHESIS_FIT_AUDIT.md \
            docs/FINAL_SUBMISSION_AUDIT.md \
            tests/test_ecology_concepts_synthesis_fit.py \
            tests/test_manuscript_references.py \
            .github/workflows/ci.yml \
            scripts/_apply_ecology_cs_upgrade_tmp.py \
            scripts/_fix_ecology_ref_parser_tmp.py \
            .github/workflows/_apply-ecology-cs-upgrade-tmp.yml
          git commit -m "Upgrade manuscript for Ecology Concepts & Synthesis"
          git push origin HEAD:agent/ecology-concepts-synthesis-upgrade-v1

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q --junitxml=pytest-${{ matrix.python-version }}.xml
      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: pytest-${{ matrix.python-version }}.xml
          if-no-files-found: warn
