name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  apply-ecological-polish:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/ecological-interpretation-polish-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ecological-interpretation-polish-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Repair LaTeX escapes in temporary patcher
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('scripts/_apply_ecological_interpretation_polish_tmp.py')
          s = p.read_text(encoding='utf-8')
          marker = '# Bibliography insertions'
          prefix, suffix = s.split(marker, 1)
          prefix = re.sub(r'(?<!\\)\\(times|rho|iota|kappa|ge)', r'\\\\\1', prefix)
          prefix = re.sub(r'(?<!\\)\\([()])', r'\\\\\1', prefix)
          p.write_text(prefix + marker + suffix, encoding='utf-8')
          PY
      - name: Apply bounded ecological interpretation and literature polish
        run: python scripts/_apply_ecological_interpretation_polish_tmp.py
      - name: Restore canonical CI and remove temporary script
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          git rm -f scripts/_apply_ecological_interpretation_polish_tmp.py
      - name: Run focused regressions
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pytest -q \
            tests/test_claim_freeze.py \
            tests/test_introduction_impossibility_gap.py \
            tests/test_manuscript_references.py \
            tests/test_ecological_interpretation_and_simplicity.py \
            tests/test_ecology_concepts_synthesis_fit.py
      - name: Commit bounded manuscript polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- manuscript/MANUSCRIPT_THEORETICAL_ECOLOGY.md \
            tests/test_manuscript_references.py \
            tests/test_ecological_interpretation_and_simplicity.py \
            docs/BACKGROUND_NOVELTY_GAP_REVIEW.md \
            submission/ECOLOGY_CONCEPTS_SYNTHESIS_FIT_AUDIT.md \
            .github/workflows/ci.yml
          git commit -m "Polish ecological interpretation and prior-art positioning"
          git push origin HEAD:agent/ecological-interpretation-polish-v1

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q --junitxml=pytest-${{ matrix.python-version }}.xml
      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: pytest-${{ matrix.python-version }}.xml
          if-no-files-found: warn
