name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Core code tests
        run: pytest -m "not prose_contract" --junitxml=pytest-core-${{ matrix.python-version }}.xml
      - name: Prose contract audit (advisory)
        continue-on-error: true
        run: pytest -m prose_contract --junitxml=pytest-prose-${{ matrix.python-version }}.xml
      - name: Upload pytest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: pytest-*-${{ matrix.python-version }}.xml
          if-no-files-found: warn
