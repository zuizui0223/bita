name: Analyze Kessler 2008 aggregate bounds

on:
  pull_request:
    paths:
      - "scripts/analyze_kessler_2008_aggregate_bounds.py"
      - "tests/test_kessler_2008_aggregate_bounds.py"
      - ".github/workflows/analyze-kessler-2008-aggregate-bounds.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Test aggregate-bound inference boundary
        run: python -m pytest -q tests/test_kessler_2008_aggregate_bounds.py

      - name: Enumerate published-aggregate sensitivity profiles
        run: |
          mkdir -p artifacts/kessler_2008_aggregate_bounds
          python scripts/analyze_kessler_2008_aggregate_bounds.py \
            artifacts/kessler_2008_aggregate_bounds/KESSLER_2008_AGGREGATE_BOUNDS_V1.json \
            artifacts/kessler_2008_aggregate_bounds/KESSLER_2008_AGGREGATE_BOUNDS_V1.md

      - name: Emit decision receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src = Path('artifacts/kessler_2008_aggregate_bounds/KESSLER_2008_AGGREGATE_BOUNDS_V1.json')
          report = json.loads(src.read_text())
          profiles = report['profiles']
          receipt = {
              'doi': report['doi'],
              'profile_count': len(profiles),
              'min_probability_delta': min(p['probability_delta_min'] for p in profiles),
              'min_probability_wald_z': min(p['probability_wald_z_min'] for p in profiles),
              'min_logit_wald_z': min(p['logit_wald_z_min'] for p in profiles),
              'min_logit_ci95_lower': min(p['logit_ci95_lower_min'] for p in profiles),
              'decision': 'SIGN_ROBUST_FORMAL_SOURCE_UNCERTAINTY_UNRESOLVED',
              'estimand_boundary': report['estimand_boundary'],
          }
          Path('artifacts/kessler_2008_aggregate_bounds/KESSLER_2008_AGGREGATE_BOUNDS_DECISION_V1.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True)
          )
          print(json.dumps(receipt, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: kessler-2008-aggregate-bounds
          path: artifacts/kessler_2008_aggregate_bounds/
          if-no-files-found: error
