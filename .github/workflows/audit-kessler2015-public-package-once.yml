name: audit-kessler2015-public-package-once

on:
  pull_request:
    paths:
      - 'scripts/audit_kessler2015_public_package.py'
      - 'tests/test_kessler2015_public_package.py'
      - '.github/workflows/audit-kessler2015-public-package-once.yml'

permissions:
  contents: write

jobs:
  audit:
    if: github.head_ref == 'theory/identification-design-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: theory/identification-design-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install current project
        run: python -m pip install -e '.[dev]'
      - name: Download publisher-hosted all-additional-files ZIP
        run: |
          curl --fail --location --retry 3 \
            'https://cdn.elifesciences.org/articles/07641/elife-07641-supp-v1.zip' \
            --output "$RUNNER_TEMP/elife-07641-supp-v1.zip"
          test -s "$RUNNER_TEMP/elife-07641-supp-v1.zip"
      - name: Inventory public package
        run: |
          python scripts/audit_kessler2015_public_package.py \
            "$RUNNER_TEMP/elife-07641-supp-v1.zip" \
            empirical/identification_design/KESSLER_2015_PUBLIC_PACKAGE_INVENTORY_V1.json \
            empirical/identification_design/KESSLER_2015_PUBLIC_PACKAGE_INVENTORY_V1.md
      - name: Validate package-audit semantics
        run: |
          pytest -q tests/test_kessler2015_public_package.py
          test -s empirical/identification_design/KESSLER_2015_PUBLIC_PACKAGE_INVENTORY_V1.json
          grep -q 'does not prove' empirical/identification_design/KESSLER_2015_PUBLIC_PACKAGE_INVENTORY_V1.md
      - name: Commit aggregate inventory only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            empirical/identification_design/KESSLER_2015_PUBLIC_PACKAGE_INVENTORY_V1.json \
            empirical/identification_design/KESSLER_2015_PUBLIC_PACKAGE_INVENTORY_V1.md
          if git diff --cached --quiet; then
            echo 'No inventory change.'
          else
            git commit -m 'Audit Kessler 2015 public supplementary package'
            git push origin HEAD:theory/identification-design-v1
          fi
