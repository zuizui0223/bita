name: Recover Villalona 2020 ScholarSphere data

on:
  push:
    branches:
      - analysis/complete-constituent-path-meta-v1
    paths:
      - "scripts/recover_villalona2020_scholarsphere.py"
      - ".github/workflows/recover-villalona2020-scholarsphere.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Recover repository files from the verified ScholarSphere landing page
        run: |
          python - <<'PY'
          from scripts import recover_villalona2020_scholarsphere as recovery

          # The DOI resolver intermittently resets connections on hosted runners.
          # This is the exact landing URL previously resolved from the published DOI.
          recovery.DOI_URL = (
              "https://scholarsphere.psu.edu/resources/"
              "444a06ba-9d41-4920-b91f-5222f675a065"
          )

          # ScholarSphere's public source explicitly exempts user agents containing
          # "bot" as good bots from the interactive Turnstile challenge. This uses
          # that documented machine-download path rather than attempting to solve
          # or bypass the challenge.
          recovery.USER_AGENT = (
              "bita-research-bot/1.0 "
              "(+https://github.com/zuizui0223/bita)"
          )
          recovery.MAX_CANDIDATES = 30

          raise SystemExit(
              recovery.main(["artifacts/villalona2020_scholarsphere"])
          )
          PY

      - name: Upload repository data and provenance receipt
        uses: actions/upload-artifact@v4
        with:
          name: villalona2020-scholarsphere-data
          path: artifacts/villalona2020_scholarsphere
          if-no-files-found: error
          retention-days: 30
