name: Recover Villalona 2020 ScholarSphere data

on:
  push:
    branches:
      - analysis/complete-constituent-path-meta-v1
    paths:
      - "scripts/recover_villalona2020_scholarsphere.py"
      - ".github/workflows/recover-villalona2020-scholarsphere.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Recover repository files from the verified ScholarSphere landing page
        run: |
          python - <<'PY'
          from scripts import recover_villalona2020_scholarsphere as recovery

          # The DOI resolver intermittently resets connections on hosted runners.
          # This is the exact landing URL previously resolved from the published DOI.
          recovery.DOI_URL = (
              "https://scholarsphere.psu.edu/resources/"
              "444a06ba-9d41-4920-b91f-5222f675a065"
          )

          browser_ua = (
              "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
              "Chrome/131 Safari/537.36"
          )
          good_bot_ua = (
              "bita-research-bot/1.0 "
              "(+https://github.com/zuizui0223/bita)"
          )

          # The public ScholarSphere application challenges ordinary anonymous
          # download requests but explicitly exempts user agents containing
          # "bot" as good bots. The landing page itself is obtained with the
          # ordinary browser agent; only /downloads/ requests use that documented
          # machine-download path.
          original_retrieve = recovery._retrieve

          def routed_retrieve(url, *, accept="text/html,*/*", referer=None):
              recovery.USER_AGENT = good_bot_ua if "/downloads/" in url else browser_ua
              return original_retrieve(url, accept=accept, referer=referer)

          recovery._retrieve = routed_retrieve
          recovery.USER_AGENT = browser_ua
          recovery.MAX_CANDIDATES = 30

          raise SystemExit(
              recovery.main(["artifacts/villalona2020_scholarsphere"])
          )
          PY

      - name: Upload repository data and provenance receipt
        uses: actions/upload-artifact@v4
        with:
          name: villalona2020-scholarsphere-data
          path: artifacts/villalona2020_scholarsphere
          if-no-files-found: error
          retention-days: 30
