name: Recover Villalona 2020 ScholarSphere data

on:
  push:
    branches:
      - analysis/complete-constituent-path-meta-v1
    paths:
      - "scripts/recover_villalona2020_scholarsphere.py"
      - ".github/workflows/recover-villalona2020-scholarsphere.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve the data DOI and recover repository files
        run: |
          python scripts/recover_villalona2020_scholarsphere.py \
            artifacts/villalona2020_scholarsphere

      - name: Upload repository data and provenance receipt
        uses: actions/upload-artifact@v4
        with:
          name: villalona2020-scholarsphere-data
          path: artifacts/villalona2020_scholarsphere
          if-no-files-found: error
          retention-days: 30
