name: One-time final supplementary visual check

on:
  push:
    branches:
      - agent/manuscript-reader-qa-v1

permissions:
  contents: write

jobs:
  final:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and Inkscape
        run: |
          python -m pip install -e '.[dev]'
          if ! command -v inkscape >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y inkscape
          fi
      - name: Reproduce and regenerate supplement
        run: |
          python scripts/run_part_i_robustness.py configs/part_i_robustness_grid.json artifacts/final_supp/part_i
          python scripts/build_supplementary_figures_svg.py artifacts/final_supp/part_i/part_i_sensitivity_evaluations.csv manuscript/supplementary/figures
          python scripts/augment_supplementary_s4_modern_estimator.py manuscript/supplementary/figures/FIGURE_S4_QUANTITATIVE_ROBUSTNESS.svg
          pytest -q tests/test_build_supplementary_figures_svg.py
      - name: Render final S2 and S4 previews
        run: |
          mkdir -p artifacts/final_supp/previews
          inkscape manuscript/supplementary/figures/FIGURE_S2_SCENARIO_SIGN_MAPS.svg --export-filename=artifacts/final_supp/previews/FigS2.png --export-width=2200
          inkscape manuscript/supplementary/figures/FIGURE_S4_QUANTITATIVE_ROBUSTNESS.svg --export-filename=artifacts/final_supp/previews/FigS4.png --export-width=2200
      - uses: actions/upload-artifact@v4
        with:
          name: final-supplementary-visual-qa
          path: artifacts/final_supp/previews/*.png
          if-no-files-found: error
      - name: Remove temporary workflow and commit final generated supplement figures
        run: |
          rm .github/workflows/_final-supp-visual-tmp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Regenerate final supplementary figures after visual QA'
          git push origin HEAD:${GITHUB_REF_NAME}
