name: One-time regenerate visual assets

on:
  push:
    branches:
      - agent/manuscript-reader-qa-v1

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Reproduce frozen Part I evaluations
        run: python scripts/run_part_i_robustness.py configs/part_i_robustness_grid.json artifacts/visual_regen/part_i
      - name: Regenerate main Figure 2
        run: python scripts/build_part_i_regime_figure_svg.py artifacts/visual_regen/part_i/part_i_sensitivity_evaluations.csv manuscript/figures/FIGURE_2_THEORY_REGIME_MAP.svg
      - name: Regenerate Supplementary Figures S1-S4
        run: |
          python scripts/build_supplementary_figures_svg.py artifacts/visual_regen/part_i/part_i_sensitivity_evaluations.csv manuscript/supplementary/figures
          python scripts/augment_supplementary_s4_modern_estimator.py manuscript/supplementary/figures/FIGURE_S4_QUANTITATIVE_ROBUSTNESS.svg
      - name: Validate figure contracts
        run: pytest -q tests/test_build_part_i_regime_figure_svg.py tests/test_committed_figure2.py tests/test_build_supplementary_figures_svg.py
      - name: Remove temporary workflow and commit generated assets
        run: |
          rm .github/workflows/_regenerate-visual-assets-tmp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Regenerate figure assets after visual QA'
          git push origin HEAD:${GITHUB_REF_NAME}
