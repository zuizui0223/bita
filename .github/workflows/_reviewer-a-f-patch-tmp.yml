name: One-time reviewer A-F corrections

on:
  push:
    branches:
      - fix/reviewer-a-f-reproducibility-v1

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply corrections
        run: python scripts/_reviewer_a_f_patch_tmp.py
      - name: Commit corrected source and remove temporary machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Address reviewer A-F reproducibility and inference corrections'
          git push origin HEAD:${GITHUB_REF_NAME}
