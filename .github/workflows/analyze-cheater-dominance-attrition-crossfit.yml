name: Analyze cheater-dominance attrition cross-fit

on:
  push:
    branches:
      - analysis/cheater-dominance-attrition-crossfit-v1
    paths:
      - "scripts/analyze_cheater_dominance_attrition_crossfit.py"
      - "empirical/mutualism_attrition/CHEATER_DOMINANCE_ATTRITION_CROSSFIT_PREREG_V1.md"
      - ".github/workflows/analyze-cheater-dominance-attrition-crossfit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crossfit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Compile analysis
        run: python -m py_compile scripts/analyze_cheater_dominance_attrition_crossfit.py
      - name: Run frozen 99,999-permutation cross-fit
        run: |
          mkdir -p artifacts
          python scripts/analyze_cheater_dominance_attrition_crossfit.py \
            artifacts/cheater_dominance_attrition_crossfit.json \
            --permutations 99999
      - uses: actions/upload-artifact@v4
        with:
          name: cheater-dominance-attrition-crossfit
          path: artifacts/cheater_dominance_attrition_crossfit.json
          if-no-files-found: error
