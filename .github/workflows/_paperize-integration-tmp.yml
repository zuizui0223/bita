name: One-time paperize integration

on:
  push:
    branches:
      - agent/manuscript-integration-tightening-v1

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply integration tightening
        run: python scripts/_paperize_integration_tmp.py
      - name: Commit transformed manuscript and remove temporary machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Tighten manuscript integration narrative'
          git push origin HEAD:${GITHUB_REF_NAME}
