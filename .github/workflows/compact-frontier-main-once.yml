name: compact-frontier-main-once

on:
  push:
    branches:
      - analysis/identification-frontier-augmentation-v1

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/identification-frontier-augmentation-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compact repeated Main prose
        run: python scripts/compact_frontier_main_once.py
      - name: Install tests
        run: python -m pip install -e '.[dev]'
      - name: Verify preserved scientific contracts
        run: |
          pytest -q \
            tests/test_ecology_submission_packaging.py \
            tests/test_theoretical_ecology_house_style.py \
            tests/test_identification_frontier_augmentation.py \
            tests/test_hypercube_face_coverage.py \
            tests/test_partial_identification_manuscript_integration.py
      - name: Remove one-shot compaction surfaces
        run: |
          rm scripts/compact_frontier_main_once.py
          rm .github/workflows/compact-frontier-main-once.yml
      - name: Commit compacted Main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Compact frontier Main while preserving scientific results'
          git push origin HEAD:analysis/identification-frontier-augmentation-v1
