name: Recover Villalona 2020 supplementary tables

on:
  push:
    branches:
      - analysis/complete-constituent-path-meta-v1
    paths:
      - "scripts/recover_villalona2020_supplement.py"
      - ".github/workflows/recover-villalona2020-supplement.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-supplement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Recover and inventory the published supplement
        run: |
          python scripts/recover_villalona2020_supplement.py \
            artifacts/villalona2020

      - name: Upload source DOCX and lossless table exports
        uses: actions/upload-artifact@v4
        with:
          name: villalona2020-supplementary-tables
          path: artifacts/villalona2020
          if-no-files-found: error
          retention-days: 30
