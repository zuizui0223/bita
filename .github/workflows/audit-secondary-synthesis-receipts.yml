name: Audit secondary-synthesis receipts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  caruso-2019:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install workbook readers
        run: python -m pip install pandas openpyxl xlrd
      - name: Reconstruct public Dryad receipt
        run: python scripts/reconstruct_caruso_2019_dryad.py
      - uses: actions/upload-artifact@v4
        with:
          name: caruso-2019-dryad-receipt
          path: empirical/mechanism_pattern_synthesis/CARUSO_2019_DRYAD_RECEIPT_V1.json
          if-no-files-found: error

  haas-desmarais-2026:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install workbook reader
        run: python -m pip install openpyxl
      - name: Reconstruct published-supplement receipt
        run: python scripts/reconstruct_haas_desmarais_2026_supplement.py
      - uses: actions/upload-artifact@v4
        with:
          name: haas-desmarais-2026-supplement-receipt
          path: empirical/mechanism_pattern_synthesis/HAAS_DESMARAIS_2026_SUPPLEMENT_RECEIPT_V1.json
          if-no-files-found: error
