name: Diagnose Urcelay 2006 provider coverage

on:
  push:
    branches:
      - analysis/formal-biblio-openalex-fetch-v1
    paths:
      - .github/workflows/diagnose-urcelay2006-provider-coverage.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Query OpenAlex and Crossref directly
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request

          title = "Relationship between corolla length and floral larceny in the South American hummingbird-pollinated Campsidium valdivianum (Bignoniaceae)"
          tests = []

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent":"bita-provider-audit/1.0","Accept":"application/json"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.loads(r.read().decode("utf-8"))

          oa_queries = {
              "exact_title_search": {
                  "search": title,
                  "filter": "from_publication_date:2006-01-01,to_publication_date:2006-12-31",
                  "per-page": "20",
                  "select": "id,doi,title,display_name,publication_year,authorships,primary_location",
              },
              "campsidium_search": {
                  "search": "Campsidium valdivianum",
                  "filter": "from_publication_date:2000-01-01,to_publication_date:2010-12-31",
                  "per-page": "50",
                  "select": "id,doi,title,display_name,publication_year,authorships,primary_location",
              },
              "urcelay_larceny_search": {
                  "search": "Urcelay floral larceny",
                  "filter": "from_publication_date:2000-01-01,to_publication_date:2010-12-31",
                  "per-page": "50",
                  "select": "id,doi,title,display_name,publication_year,authorships,primary_location",
              },
          }
          out={"openalex":{},"crossref":{}}
          for name, params in oa_queries.items():
              url="https://api.openalex.org/works?"+urllib.parse.urlencode(params)
              try:
                  p=get(url)
                  out["openalex"][name]={
                      "count":p.get("meta",{}).get("count"),
                      "results":p.get("results",[])
                  }
              except Exception as e:
                  out["openalex"][name]={"error":repr(e)}

          cr_queries = {
              "exact_title": title,
              "campsidium": "Campsidium valdivianum Urcelay Morales Chalcoff",
          }
          for name,q in cr_queries.items():
              params={
                  "query.bibliographic":q,
                  "filter":"from-pub-date:2006-01-01,until-pub-date:2006-12-31",
                  "rows":"20",
                  "select":"DOI,title,author,container-title,published,URL",
              }
              url="https://api.crossref.org/works?"+urllib.parse.urlencode(params)
              try:
                  p=get(url)
                  out["crossref"][name]={
                      "total_results":p.get("message",{}).get("total-results"),
                      "items":p.get("message",{}).get("items",[])
                  }
              except Exception as e:
                  out["crossref"][name]={"error":repr(e)}

          print(json.dumps(out, indent=2, ensure_ascii=False))
          PY
