name: Analyze species-level robust access routing

on:
  pull_request:
    paths:
      - "scripts/analyze_joint_access_routing_species_robust.py"
      - "scripts/analyze_aubert2026_missingness_dependence_sensitivity.py"
      - "tests/test_joint_access_routing_species_robust.py"
      - ".github/workflows/analyze-access-routing-species-robust.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tests
        run: python -m pip install -e '.[dev]'
      - name: Test robust joint analysis
        run: pytest -q tests/test_joint_access_routing_species_robust.py tests/test_aubert2026_missingness_dependence_sensitivity.py
      - name: Run robust species-level joint analysis
        run: |
          python scripts/analyze_joint_access_routing_species_robust.py             artifacts/joint_access_routing_species_robust.json             --permutations 9999
      - name: Show decision fields
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("artifacts/joint_access_routing_species_robust.json").read_text())
          print("Sakhalkar", r["network_effects"]["sakhalkar"])
          print("Aubert", r["network_effects"]["aubert_ephi"])
          print("Aubert binary", r["aubert_binary_barrier_plant_species_check"])
          print("joint rho", r["joint_equal_network_fisher_z_rho"])
          print("joint p", r["joint_permutation_p_two_sided"])
          print("input audit", r["aubert_input_audit"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: joint-access-routing-species-robust
          path: artifacts/joint_access_routing_species_robust.json
          if-no-files-found: error
