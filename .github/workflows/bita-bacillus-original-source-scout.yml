name: bita-bacillus-original-source-scout
on:
  push:
    branches: ['analysis/bita-bacillus-benefit-persistence-20261115']
    paths:
      - '.github/workflows/bita-bacillus-original-source-scout.yml'
  pull_request:
    branches: ['analysis/bita-pseudomonas-wt-comparison-20261115']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audited-source-scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read peer-reviewed Bacillus first experiment and follow-up from original public sources
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,re,urllib.request,urllib.error,xml.etree.ElementTree as ET
          from pathlib import Path
          p=Path('public_source_audit');p.mkdir(exist_ok=True)
          h={'User-Agent':'BITA-evolution-source-audit/1.0 (public,read-only)','Accept':'application/xml,text/html'}
          urls={
           'initial_2018':'https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6331042/fullTextXML',
           'nature_followup':'https://www.nature.com/articles/s41564-018-0263-y',
           'followup_europepmc':'https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=EXT_ID%3A30297741%20AND%20SRC%3AMED&format=json',
          }
          out={}
          for key,url in urls.items():
              try:
                  req=urllib.request.Request(url,headers=h)
                  with urllib.request.urlopen(req,timeout=25) as resp:
                      data=resp.read(1800000)
                      mime=resp.headers.get('content-type')
                  entry={'status':resp.status,'bytes':len(data),
                         'sha256':hashlib.sha256(data).hexdigest(),'mime':mime}
                  if key=='initial_2018':
                      p.joinpath('PMC6331042.xml').write_bytes(data)
                      root=ET.fromstring(data)
                      def tx(node):return ' '.join(''.join(node.itertext()).split())
                      figs=[{'id':fig.get('id'),
                             'label':tx(fig.find('label')) if fig.find('label') is not None else '',
                             'caption':tx(fig.find('caption')) if fig.find('caption') is not None else ''}
                             for fig in root.iter('fig')]
                      entry['figs']=figs
                      entries=[]
                      for sec in root.iter('sec'):
                          t=sec.find('title')
                          if t is None:continue
                          title=tx(t)
                          matches=[tx(x) for x in sec.findall('p') if
                            any(word in tx(x).lower() for word in ['division of labor','productivity','30%','stable','simula','f >','stable coexistence','negative-frequency'])]
                          if matches:entries.append({'title':title,'paragraphs':matches[:15]})
                      entry['sections']=entries
                      entry['supplemental']=[{'id':s.get('id'),'href':s.get('{http://www.w3.org/1999/xlink}href'),
                        'name':tx(s.find('label')) if s.find('label') is not None else ''}
                        for s in root.iter('supplementary-material')]
                  elif key=='nature_followup':
                      html=data.decode('utf8','replace')
                      entry['title']=re.findall(r'<title[^>]*>(.*?)</title>',html,re.I|re.S)[:1]
                      entry['published_asset_links']=sorted(set(re.findall(r'https?[^" ]+\.xlsx(?:\?[^" ]*)?',html,re.I)))[:40]
                      entry['relative_xlsx_links']=sorted(set(re.findall(r'href="([^"]+\.xlsx[^"]*)"',html,re.I)))[:40]
                      entry['data_availability_excerpts']=[re.sub(r'<[^>]+>',' ',html[max(0,m.start()-150):m.start()+550]) for m in list(re.finditer('Data availability',html,re.I))[:3]]
                      p.joinpath('nature_article_source.html').write_bytes(data)
                  else:
                      entry['source_json']=json.loads(data)
                  out[key]=entry
              except urllib.error.HTTPError as ex:out[key]={'status':ex.code,'reason':str(ex.reason)}
              except Exception as ex:out[key]={'status':'ERROR','reason':type(ex).__name__+': '+str(ex)[:180]}
          p.joinpath('manifest.json').write_text(json.dumps(out,indent=2,ensure_ascii=False))
          print('BITA_BACILLUS_SOURCE_RECEIPT:'+json.dumps(out,ensure_ascii=False,separators=(',',':')),flush=True)
          if out['initial_2018'].get('status')!=200:
              out['initial_2018']['claim_boundary']='Europe PMC fullTextXML unavailable; use separately source-indexed original PMC text without pretending original JATS downloaded'
              print('BITA_INITIAL_JATS_UNAVAILABLE:'+json.dumps(out['initial_2018']),flush=True)
          # Nature publishes its original Supplementary Dataset 1 as a static XLSX
          # with an exact link extracted from publisher HTML. Parse in-memory;
          # retain workbook only in the Actions artifact; never invent variants.
          import io,zipfile,xml.etree.ElementTree as ET
          link=out.get('nature_followup',{}).get('relative_xlsx_links',[])
          if len(link)==1:
              official=link[0].replace('&amp;','&')
              try:
                  with urllib.request.urlopen(urllib.request.Request(official,headers={
                      'User-Agent':'BITA-evolution-source-audit/1.0'}),timeout=35) as response:
                      wb=response.read(6500000)
                  if not zipfile.is_zipfile(io.BytesIO(wb)):
                      raise ValueError('publisher supplement is not original XLSX')
                  sheetlist=[]
                  ns='{http://schemas.openxmlformats.org/spreadsheetml/2006/main}'
                  with zipfile.ZipFile(io.BytesIO(wb)) as zip:
                      shared=[]
                      if 'xl/sharedStrings.xml' in zip.namelist():
                          el=ET.fromstring(zip.read('xl/sharedStrings.xml'))
                          for s in el.findall(ns+'si'):
                              shared.append(''.join(t.text or '' for t in s.iter(ns+'t')))
                      for n in zip.namelist():
                          if n.startswith('xl/worksheets/sheet') and n.endswith('.xml'):
                              root=ET.fromstring(zip.read(n))
                              rows=[]
                              for row in root.iter(ns+'row'):
                                  result=[]
                                  for cell in row.findall(ns+'c'):
                                      value=cell.find(ns+'v')
                                      if value is not None:
                                          v=value.text
                                          if cell.attrib.get('t')=='s':
                                              v=shared[int(v)]
                                      else:
                                          inline=cell.find(ns+'is')
                                          v=''.join(t.text or '' for t in inline.iter(ns+'t')) if inline is not None else None
                                      result.append([cell.attrib.get('r'),v])
                                  rows.append(result)
                              sheetlist.append({'name':n,'n_rows':len(rows),
                                                'preview_rows':rows[:18],
                                                'nonempty_cells':sum(len(r) for r in rows)})
                  p.joinpath('Nature_Supplementary_Dataset_1.xlsx').write_bytes(wb)
                  out['followup_original_supplement']={
                       'status':200,'url':official,'bytes':len(wb),
                       'sha256':hashlib.sha256(wb).hexdigest(),'sheets':sheetlist}
              except urllib.error.HTTPError as ex:
                  out['followup_original_supplement']={'status':ex.code,'reason':str(ex.reason)}
              except Exception as ex:
                  out['followup_original_supplement']={'status':'ERROR','reason':type(ex).__name__+': '+str(ex)[:150]}
          p.joinpath('manifest.json').write_text(json.dumps(out,indent=2,ensure_ascii=False))
          print('BITA_BACILLUS_SUPPLEMENT_SOURCE:'+json.dumps(out.get('followup_original_supplement',{}),ensure_ascii=False,separators=(',',':')),flush=True)
          if out.get('followup_original_supplement',{}).get('status')!=200:
              raise RuntimeError('Published follow-up supplement not verified')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bita-bacillus-2018-primary-source-evidence
          path: public_source_audit/
          if-no-files-found: error
          retention-days: 30
