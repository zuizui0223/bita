name: reorganize-result-figures-once

on:
  push:
    branches:
      - agent/add-main-figures-4-5-v1
    paths:
      - 'scripts/reorganize_result_figures_once.py'

permissions:
  contents: write

jobs:
  reorganize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-main-figures-4-5-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reorganize Main and Supplement figures
        run: python scripts/reorganize_result_figures_once.py
      - name: Commit synchronized figure hierarchy
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- manuscript/MANUSCRIPT_THEORETICAL_ECOLOGY.md manuscript/supplementary/SUPPLEMENTARY_MATERIAL.md manuscript/figures/README.md SUPPLEMENT_MANIFEST.md scripts/build_ecology_submission_sources.py submission/FIGURE_AND_TABLE_PLAN.md tests/test_ecology_submission_packaging.py
          git rm -f manuscript/figures/FIGURE_4_MECHANISM_PATTERN_OVERVIEW.svg
          git rm -f scripts/reorganize_result_figures_once.py .github/workflows/reorganize-result-figures-once.yml
          git commit -m 'Reorganize result figures between Main and Supplement'
          git push origin HEAD:agent/add-main-figures-4-5-v1
