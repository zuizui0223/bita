name: Screen formal OA fulltext structure

on:
  push:
    branches:
      - analysis/formal-biblio-openalex-fetch-v1
    paths:
      - .github/workflows/screen-direct-access-geometry-oa-fulltext.yml

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF parser
        run: python -m pip install -q pypdf

      - name: Run direction-blind OA fulltext structural screen
        run: |
          python scripts/screen_direct_access_geometry_oa_fulltext_structure.py \
            --access-queue empirical/floral_defence_selectivity/formal_bibliographic_frame_v2/DIRECT_ACCESS_GEOMETRY_FULLTEXT_ACCESS_QUEUE_V1.csv \
            --decisions empirical/floral_defence_selectivity/formal_bibliographic_frame_v2/DIRECT_ACCESS_GEOMETRY_ELIGIBILITY_DECISIONS_V2.csv \
            --output empirical/floral_defence_selectivity/formal_bibliographic_frame_v2/DIRECT_ACCESS_GEOMETRY_OA_FULLTEXT_STRUCTURAL_SCREEN_V1.csv \
            --updated-decisions empirical/floral_defence_selectivity/formal_bibliographic_frame_v2/DIRECT_ACCESS_GEOMETRY_ELIGIBILITY_DECISIONS_V3.csv \
            --receipt empirical/floral_defence_selectivity/formal_bibliographic_frame_v2/DIRECT_ACCESS_GEOMETRY_OA_FULLTEXT_STRUCTURAL_SCREEN_RECEIPT_V1.json

      - name: Validate post-fulltext structural ledger
        run: |
          python scripts/validate_direct_access_geometry_fulltext_decisions.py \
            --screen empirical/floral_defence_selectivity/formal_bibliographic_frame_v2/DIRECT_ACCESS_GEOMETRY_BIBLIOGRAPHIC_SCREEN_V1.csv \
            --decisions empirical/floral_defence_selectivity/formal_bibliographic_frame_v2/DIRECT_ACCESS_GEOMETRY_ELIGIBILITY_DECISIONS_V3.csv

      - name: Print structural-screen counts
        run: |
          cat empirical/floral_defence_selectivity/formal_bibliographic_frame_v2/DIRECT_ACCESS_GEOMETRY_OA_FULLTEXT_STRUCTURAL_SCREEN_RECEIPT_V1.json
          python scripts/validate_direct_access_geometry_fulltext_decisions.py \
            --screen empirical/floral_defence_selectivity/formal_bibliographic_frame_v2/DIRECT_ACCESS_GEOMETRY_BIBLIOGRAPHIC_SCREEN_V1.csv \
            --decisions empirical/floral_defence_selectivity/formal_bibliographic_frame_v2/DIRECT_ACCESS_GEOMETRY_ELIGIBILITY_DECISIONS_V3.csv

      - name: Commit direction-blind OA fulltext structural screen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            empirical/floral_defence_selectivity/formal_bibliographic_frame_v2/DIRECT_ACCESS_GEOMETRY_OA_FULLTEXT_STRUCTURAL_SCREEN_V1.csv \
            empirical/floral_defence_selectivity/formal_bibliographic_frame_v2/DIRECT_ACCESS_GEOMETRY_ELIGIBILITY_DECISIONS_V3.csv \
            empirical/floral_defence_selectivity/formal_bibliographic_frame_v2/DIRECT_ACCESS_GEOMETRY_OA_FULLTEXT_STRUCTURAL_SCREEN_RECEIPT_V1.json
          if git diff --cached --quiet; then
            echo "No fulltext structural-screen changes."
          else
            git commit -m "Screen OA fulltexts for route and access structure"
            git push origin HEAD:analysis/formal-biblio-openalex-fetch-v1
          fi
