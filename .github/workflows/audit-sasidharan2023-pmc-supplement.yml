name: Audit Sasidharan 2023 PMC supplement

on:
  pull_request:
    paths:
      - "scripts/audit_sasidharan2023_pmc_supplement.py"
      - ".github/workflows/audit-sasidharan2023-pmc-supplement.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded workbook parser
        run: python -m pip install "openpyxl>=3.1,<4"
      - name: Audit article-declared Tables S1-S5 workbook
        run: |
          python scripts/audit_sasidharan2023_pmc_supplement.py \
            artifacts/sasidharan2023_pmc_supplement_schema.json
      - name: Publish schema-only audit summary
        run: |
          {
            echo '## Sasidharan 2023 supplement schema audit'
            echo
            echo '```json'
            cat artifacts/sasidharan2023_pmc_supplement_schema.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/sasidharan2023_pmc_supplement_schema.json').read_text())
          source = {
              'source_doi': report['source_doi'],
              'pmcid': report['pmcid'],
              'supplement_name': report['supplement_name'],
              'sheet_count': report['workbook']['sheet_count'],
          }
          print('::notice title=Sasidharan 2023 source::' + json.dumps(source, separators=(',', ':')))
          for index, sheet in enumerate(report['workbook']['sheets'], start=1):
              concise = {
                  'index': index,
                  'sheet_name': sheet['sheet_name'],
                  'max_row': sheet['max_row'],
                  'max_column': sheet['max_column'],
                  'nonempty_row_count': sheet['nonempty_row_count'],
                  'header_row': sheet['detected_header_row_within_first_10_nonempty'],
                  'headers': sheet['headers'],
                  'candidate_columns': sheet['candidate_columns'],
              }
              print(f'::notice title=Sasidharan 2023 sheet {index}::' + json.dumps(concise, separators=(',', ':')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sasidharan2023-pmc-supplement-schema
          path: artifacts/sasidharan2023_pmc_supplement_schema.json
          if-no-files-found: error
