name: Audit Sasidharan 2023 PMC supplement

on:
  pull_request:
    paths:
      - "scripts/audit_sasidharan2023_pmc_supplement.py"
      - "scripts/audit_sasidharan2023_s1_domains.py"
      - ".github/workflows/audit-sasidharan2023-pmc-supplement.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded workbook parser
        run: python -m pip install "openpyxl>=3.1,<4"
      - name: Audit article-declared Tables S1-S5 workbook
        run: |
          python scripts/audit_sasidharan2023_pmc_supplement.py \
            artifacts/sasidharan2023_pmc_supplement_schema.json
      - name: Audit S1 coding domains and publication dependence
        run: |
          python scripts/audit_sasidharan2023_s1_domains.py \
            artifacts/sasidharan2023_s1_domains.json
      - name: Publish aggregate audit summaries
        run: |
          {
            echo '## Sasidharan 2023 supplement schema audit'
            echo
            echo '```json'
            cat artifacts/sasidharan2023_pmc_supplement_schema.json
            echo '```'
            echo
            echo '## S1 coding-domain and publication-dependence audit'
            echo
            echo '```json'
            cat artifacts/sasidharan2023_s1_domains.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import json
          from pathlib import Path
          schema = json.loads(Path('artifacts/sasidharan2023_pmc_supplement_schema.json').read_text())
          domains = json.loads(Path('artifacts/sasidharan2023_s1_domains.json').read_text())
          source = {
              'source_doi': schema['source_doi'],
              'pmcid': schema['pmcid'],
              'supplement_name': schema['supplement_name'],
              'sheet_count': schema['workbook']['sheet_count'],
              'sheet_names': [sheet['sheet_name'] for sheet in schema['workbook']['sheets']],
          }
          coding = {
              'analyzed_test_rows': domains['analyzed_test_rows'],
              'domains': domains['domains'],
          }
          print('::notice title=Sasidharan 2023 source::' + json.dumps(source, separators=(',', ':')))
          print('::notice title=Sasidharan 2023 dependence::' + json.dumps(domains['publication_dependence'], separators=(',', ':')))
          print('::notice title=Sasidharan 2023 S1 coding::' + json.dumps(coding, separators=(',', ':')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sasidharan2023-pmc-supplement-audit
          path: |
            artifacts/sasidharan2023_pmc_supplement_schema.json
            artifacts/sasidharan2023_s1_domains.json
          if-no-files-found: error
