name: Recover Parachnowitsch 2019 study-level supplement

on:
  push:
    branches:
      - analysis/complete-constituent-path-meta-v1
    paths:
      - "scripts/recover_parachnowitsch2019_supplement.py"
      - "scripts/recover_parachnowitsch2019_signed_url.py"
      - ".github/workflows/recover-parachnowitsch2019-supplement.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-supplement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install workbook reader
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5

      - name: Recover and inventory the published supplement
        run: |
          python scripts/recover_parachnowitsch2019_signed_url.py \
            artifacts/parachnowitsch2019

      - name: Upload source workbook and lossless worksheet exports
        uses: actions/upload-artifact@v4
        with:
          name: parachnowitsch2019-study-level-supplement
          path: artifacts/parachnowitsch2019
          if-no-files-found: error
          retention-days: 30
