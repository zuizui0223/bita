name: Audit Theis 2014 Cucurbitaceae Dryad

on:
  pull_request:
    paths:
      - "scripts/audit_theis2014_cucurbita_dryad.py"
      - ".github/workflows/audit-theis2014-cucurbita-dryad.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit public Dryad schema and linkage fields
        run: |
          python scripts/audit_theis2014_cucurbita_dryad.py artifacts/theis2014_cucurbita_dryad_audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: theis2014-cucurbita-dryad-audit
          path: artifacts/theis2014_cucurbita_dryad_audit.json
          if-no-files-found: error
