name: Build supplementary figures

on:
  push:
    branches:
      - analysis/pattern-expansion-v1
    paths:
      - "scripts/build_supplementary_figures_svg.py"
      - "scripts/run_part_i_robustness.py"
      - "tests/test_build_supplementary_figures_svg.py"
      - "configs/part_i_robustness_grid.json"
      - "trait_architecture/model.py"
      - "trait_architecture/robustness.py"
      - "empirical/mechanism_pattern_synthesis/*LEDGER*_V1.csv"
      - "empirical/mechanism_pattern_synthesis/EXPANSION_SIGN_SWITCH_BATCH_*_V1.csv"
      - "empirical/mechanism_pattern_synthesis/EXPANSION_CONTEXT_PROGRAMS_V1.csv"
      - "empirical/mechanism_pattern_synthesis/SECONDARY_SYNTHESIS_MODULES_V1.csv"
      - "empirical/mechanism_pattern_synthesis/SYNTHESIS_ROBUSTNESS_AUDIT_V1.md"
      - ".github/workflows/build-supplementary-figures.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/pattern-expansion-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Reproduce Part I evaluations
        run: python scripts/run_part_i_robustness.py configs/part_i_robustness_grid.json artifacts/supplementary/part_i
      - name: Build Supplementary Figures S1-S4
        run: python scripts/build_supplementary_figures_svg.py artifacts/supplementary/part_i/part_i_sensitivity_evaluations.csv manuscript/supplementary/figures
      - name: Validate supplementary figures
        run: pytest -q tests/test_build_supplementary_figures_svg.py
      - name: Commit generated SVGs when changed
        run: |
          paths="manuscript/supplementary/figures"
          if [ -z "$(git status --porcelain -- $paths)" ]; then
            echo "Supplementary SVGs already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $paths
            git commit -m "Generate Supplementary Figures S1-S4"
            git fetch origin analysis/pattern-expansion-v1
            git rebase origin/analysis/pattern-expansion-v1
            git push origin HEAD:analysis/pattern-expansion-v1
          fi
