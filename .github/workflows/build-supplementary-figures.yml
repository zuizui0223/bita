name: Build supplementary package

on:
  pull_request:
    paths:
      - "scripts/build_supplementary_figures_svg.py"
      - "scripts/augment_supplementary_s4_modern_estimator.py"
      - "scripts/build_supplementary_tables_s1_s3.py"
      - "scripts/build_supplementary_tables_s4_s6.py"
      - "scripts/run_part_i_robustness.py"
      - "tests/test_build_supplementary_figures_svg.py"
      - "tests/test_build_supplementary_tables.py"
      - "configs/part_i_robustness_grid.json"
      - "trait_architecture/model.py"
      - "trait_architecture/robustness.py"
      - "empirical/mechanism_pattern_synthesis/*LEDGER*_V1.csv"
      - "empirical/mechanism_pattern_synthesis/EXPANSION_SIGN_SWITCH_BATCH_*_V1.csv"
      - "empirical/mechanism_pattern_synthesis/EXPANSION_CONTEXT_PROGRAMS_V1.csv"
      - "empirical/mechanism_pattern_synthesis/*PRIORITY_RESCREEN_BATCH_*_V1.csv"
      - "empirical/mechanism_pattern_synthesis/DIRECT_AXD_AUDIT_V1.csv"
      - "empirical/mechanism_pattern_synthesis/JOINT_COST_AUDIT_V1.csv"
      - "empirical/mechanism_pattern_synthesis/SECONDARY_SYNTHESIS_MODULES_V1.csv"
      - "empirical/mechanism_pattern_synthesis/SYNTHESIS_ROBUSTNESS_AUDIT_V1.md"
      - "empirical/mechanism_pattern_synthesis/LEAL_2025_MODERN_ESTIMATOR_SENSITIVITY_V1.json"
      - "manuscript/supplementary/SUPPLEMENTARY_MATERIAL.md"
      - "manuscript/supplementary/figures/**"
      - "manuscript/supplementary/tables/**"
      - ".github/workflows/build-supplementary-figures.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Reproduce Part I evaluations
        run: python scripts/run_part_i_robustness.py configs/part_i_robustness_grid.json artifacts/supplementary/part_i
      - name: Rebuild Supplementary Figures S1-S4
        run: |
          mkdir -p artifacts/supplementary/generated/figures
          python scripts/build_supplementary_figures_svg.py artifacts/supplementary/part_i/part_i_sensitivity_evaluations.csv artifacts/supplementary/generated/figures
          python scripts/augment_supplementary_s4_modern_estimator.py artifacts/supplementary/generated/figures/FIGURE_S4_QUANTITATIVE_ROBUSTNESS.svg
      - name: Rebuild Supplementary Tables S1-S6
        run: |
          mkdir -p artifacts/supplementary/generated/tables
          python scripts/build_supplementary_tables_s1_s3.py artifacts/supplementary/part_i/part_i_full_tested_set_summary.csv artifacts/supplementary/generated/tables
          python scripts/build_supplementary_tables_s4_s6.py artifacts/supplementary/generated/tables
      - name: Validate supplementary package
        run: pytest -q tests/test_build_supplementary_figures_svg.py tests/test_build_supplementary_tables.py
      - name: Check committed supplement assets are current
        run: |
          diff -ru manuscript/supplementary/figures artifacts/supplementary/generated/figures
          diff -ru manuscript/supplementary/tables artifacts/supplementary/generated/tables
      - uses: actions/upload-artifact@v4
        with:
          name: supplementary-package-rebuild
          path: artifacts/supplementary/generated/
          if-no-files-found: error
