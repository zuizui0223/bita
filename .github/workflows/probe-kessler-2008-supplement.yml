name: Probe Kessler 2008 supplement

on:
  pull_request:
    paths:
      - "scripts/probe_kessler_2008_supplement.py"
      - "tests/test_kessler_2008_supplement_probe.py"
      - ".github/workflows/probe-kessler-2008-supplement.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install probe dependencies
        run: python -m pip install pytest pypdf

      - name: Test fail-closed access and inference boundary
        run: python -m pytest -q tests/test_kessler_2008_supplement_probe.py

      - name: Probe registered Science supporting-material routes
        run: |
          mkdir -p artifacts/kessler_2008_supplement
          python scripts/probe_kessler_2008_supplement.py \
            artifacts/kessler_2008_supplement/KESSLER_2008_SUPPLEMENT_PROBE_V1.json \
            artifacts/kessler_2008_supplement/KESSLER_2008_SUPPLEMENT_PROBE_V1.md

      - name: Emit bounded receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src = Path('artifacts/kessler_2008_supplement/KESSLER_2008_SUPPLEMENT_PROBE_V1.json')
          report = json.loads(src.read_text())
          receipt = {
              'doi': report['doi'],
              'supplement_status': report['supplement_status'],
              'figure_s8a_text_status': report['figure_s8a_text_status'],
              'claim_boundary': report['claim_boundary'],
          }
          out = Path('artifacts/kessler_2008_supplement/KESSLER_2008_SUPPLEMENT_ACCESS_RECEIPT_V1.json')
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True))
          print(json.dumps(receipt, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: kessler-2008-supplement-probe
          path: artifacts/kessler_2008_supplement/
          if-no-files-found: error
