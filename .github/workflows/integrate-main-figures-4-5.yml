name: integrate-main-figures-4-5

on:
  pull_request:
    paths:
      - 'scripts/_integrate_main_figures_4_5_tmp.py'
      - '.github/workflows/integrate-main-figures-4-5.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'agent/add-main-figures-4-5-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-main-figures-4-5-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply bounded figure integration
        run: |
          python scripts/_integrate_main_figures_4_5_tmp.py
          python -m pip install matplotlib pytest
          python scripts/build_main_figures_4_5.py
      - name: Run focused regressions
        run: |
          python -m pytest -q tests/test_ecology_submission_packaging.py tests/test_claim_freeze.py
      - name: Remove one-time integration helpers
        run: |
          git rm -f scripts/_integrate_main_figures_4_5_tmp.py
          git rm -f .github/workflows/integrate-main-figures-4-5.yml
      - name: Commit integrated figure package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate main Figures 4 and 5 into manuscript"
          git push origin HEAD:agent/add-main-figures-4-5-v1
