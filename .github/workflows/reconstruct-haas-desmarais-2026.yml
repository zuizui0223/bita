name: Reconstruct Haas-Desmarais 2026 supplement

on:
  push:
    branches:
      - analysis/pattern-expansion-v1
    paths:
      - "scripts/reconstruct_haas_desmarais_2026_supplement.py"
      - ".github/workflows/reconstruct-haas-desmarais-2026.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/pattern-expansion-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install workbook inspector
        run: python -m pip install openpyxl
      - name: Retrieve and inspect published supplement
        run: python scripts/reconstruct_haas_desmarais_2026_supplement.py
      - name: Commit reproducibility receipt
        run: |
          path="empirical/mechanism_pattern_synthesis/HAAS_DESMARAIS_2026_SUPPLEMENT_RECEIPT_V1.json"
          if [ -z "$(git status --porcelain -- $path)" ]; then
            echo "Haas supplement receipt already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $path
          git commit -m "Record Haas-Desmarais 2026 supplement receipt"
          git fetch origin analysis/pattern-expansion-v1
          git rebase origin/analysis/pattern-expansion-v1
          git push origin HEAD:analysis/pattern-expansion-v1
