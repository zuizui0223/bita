name: Validate Leal modern-estimator sensitivity

on:
  pull_request:
    paths:
      - "scripts/run_leal_modern_estimator_sensitivity.py"
      - "empirical/broad_reality_evidence/larceny_gate/**"
      - "empirical/mechanism_pattern_synthesis/LEAL_2025_MODERN_ESTIMATOR_SENSITIVITY_V1.*"
      - ".github/workflows/leal-modern-estimator-sensitivity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run REML plus modified Hartung-Knapp sensitivity from canonical local Leal inputs
        run: python scripts/run_leal_modern_estimator_sensitivity.py
      - name: Require canonical DL reproduction and conservative-direction result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("empirical/mechanism_pattern_synthesis/LEAL_2025_MODERN_ESTIMATOR_SENSITIVITY_V1.json")
          data = json.loads(path.read_text())
          assert data["canonical_source_commit"] == "ed33b25593c0d90ad6657753f6f5501d9efc7b82"
          assert data["canonical_results_remain_der_simonian_laird"] is True
          assert data["sensitivity_only"] is True
          assert data["status"] in {"ROBUSTNESS_PASS", "SENSITIVITY_QUALIFIES_CLAIM"}
          for row in data["results"].values():
              assert row["k"] >= 22
              assert row["tau2_reml"] >= 0
          PY
      - name: Check deterministic sensitivity readout is current
        run: |
          git diff --exit-code -- \
            empirical/mechanism_pattern_synthesis/LEAL_2025_MODERN_ESTIMATOR_SENSITIVITY_V1.md \
            empirical/mechanism_pattern_synthesis/LEAL_2025_MODERN_ESTIMATOR_SENSITIVITY_V1.json
