name: Diagnose final Apidologie note

on:
  push:
    branches:
      - analysis/formal-biblio-openalex-fetch-v1
    paths:
      - .github/workflows/diagnose-final-apidologie-note.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and inspect article without persisting text
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python - <<'PY'
          import json, re, subprocess, tempfile, urllib.request
          from pathlib import Path

          urls=[
            "https://link.springer.com/content/pdf/10.1007/s13592-023-01024-w.pdf",
            "https://link.springer.com/article/10.1007/s13592-023-01024-w",
          ]
          result={"doi":"10.1007/s13592-023-01024-w","attempts":[]}
          text=""
          for url in urls:
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 bita-audit/1.0","Accept":"application/pdf,text/html,*/*"})
              with urllib.request.urlopen(req,timeout=60) as r:
                data=r.read(5_000_000)
                ct=r.headers.get("Content-Type","")
                result["attempts"].append({"url":url,"status":r.status,"content_type":ct,"bytes":len(data),"pdf":data.startswith(b"%PDF")})
                if data.startswith(b"%PDF"):
                  with tempfile.TemporaryDirectory() as td:
                    pdf=Path(td)/"a.pdf"; txt=Path(td)/"a.txt"
                    pdf.write_bytes(data)
                    p=subprocess.run(["pdftotext","-layout",str(pdf),str(txt)],capture_output=True,text=True,timeout=60)
                    if p.returncode==0 and txt.exists():
                      text=txt.read_text(errors="replace")
                      break
            except Exception as e:
              result["attempts"].append({"url":url,"error":type(e).__name__+":"+str(e)[:200]})
          if text:
            norm=re.sub(r"\s+"," ",text)
            pats={
              "route":r"nectar rob\w*|illegitimate visit\w*|floral larcen\w*",
              "geometry":r"corolla (?:length|depth|tube)|flower (?:length|depth|size)|body size|bee size|tongue length|proboscis|lever mechanism",
              "quant":r"\bp\s*[<=>]|anova|regress\w*|correlat\w*|chi[- ]?square|glm|sample size|\bn\s*=|mean\s*[±+-]",
              "comparison":r"compare\w*|difference\w*|larger|smaller|longer|shorter|deeper|shallower",
            }
            result["text_chars"]=len(norm)
            result["signals"]={k:len(re.findall(v,norm,re.I)) for k,v in pats.items()}
            result["has_methods"]=bool(re.search(r"\bmethods?\b|materials and methods",norm,re.I))
            result["has_results"]=bool(re.search(r"\bresults?\b",norm,re.I))
            # structural co-occurrence only, no article prose emitted
            windows=[]
            for m in re.finditer(pats["route"],norm,re.I):
              a=max(0,m.start()-500); b=min(len(norm),m.end()+500)
              w=norm[a:b]
              windows.append({
                "geometry":bool(re.search(pats["geometry"],w,re.I)),
                "quant":bool(re.search(pats["quant"],w,re.I)),
                "comparison":bool(re.search(pats["comparison"],w,re.I)),
              })
            result["route_windows"]=len(windows)
            result["route_windows_with_geometry"]=sum(x["geometry"] for x in windows)
            result["route_windows_with_geometry_and_quant"]=sum(x["geometry"] and x["quant"] for x in windows)
          else:
            result["text_chars"]=0
            result["signals"]={}
          print(json.dumps(result,indent=2))
          PY
