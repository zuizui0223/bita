name: Diagnose final Apidologie metadata

on:
  push:
    branches:
      - analysis/formal-biblio-openalex-fetch-v1
    paths:
      - .github/workflows/diagnose-final-apidologie-metadata.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query bibliographic providers
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, re
          doi="10.1007/s13592-023-01024-w"
          out={}
          def get(url):
            req=urllib.request.Request(url,headers={"User-Agent":"bita-final-note-audit/1.0","Accept":"application/json"})
            with urllib.request.urlopen(req,timeout=60) as r:
              return json.loads(r.read().decode())
          try:
            cr=get("https://api.crossref.org/works/"+urllib.parse.quote(doi,safe=""))
            m=cr["message"]
            out["crossref"]={
              "title":m.get("title"),
              "abstract":re.sub("<[^>]+>"," ",m.get("abstract","")),
              "type":m.get("type"),
              "page":m.get("page"),
              "publisher":m.get("publisher"),
              "reference_count":m.get("reference-count"),
            }
          except Exception as e:
            out["crossref"]={"error":repr(e)}
          try:
            oa=get("https://api.openalex.org/works/https://doi.org/"+doi)
            inv=oa.get("abstract_inverted_index") or {}
            toks=[]
            for word,poses in inv.items():
              for p in poses or []: toks.append((p,word))
            toks.sort()
            out["openalex"]={
              "id":oa.get("id"),
              "type":oa.get("type"),
              "title":oa.get("title"),
              "abstract":" ".join(w for _,w in toks),
              "cited_by_count":oa.get("cited_by_count"),
              "keywords":[x.get("display_name") for x in (oa.get("keywords") or [])],
              "topics":[x.get("display_name") for x in (oa.get("topics") or [])[:5]],
            }
          except Exception as e:
            out["openalex"]={"error":repr(e)}
          try:
            ss=get("https://api.semanticscholar.org/graph/v1/paper/DOI:"+doi+"?fields=title,abstract,year,publicationTypes,fieldsOfStudy")
            out["semantic_scholar"]=ss
          except Exception as e:
            out["semantic_scholar"]={"error":repr(e)}
          print(json.dumps(out,indent=2,ensure_ascii=False))
          PY
